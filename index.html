      beep(523, 0.95, 0.20, 0.25);
      beep(784, 1.15, 0.45, 0.3);
    } else {
      beep(784, 0,    0.28, 0.35); // G5
      beep(659, 0.22, 0.28, 0.35); // E5
      beep(523, 0.44, 0.55, 0.4);  // C5
    }
    setTimeout(() => { try { ctx.close(); } catch (e) {} }, 2000);
  } catch (e) { console.warn("pomo chime failed", e); }
}

// --- Level system: XP → level. XP is GOAL-NORMALIZED so levels are fair across players:
// hitting your daily goal = 100 XP no matter what your point values are; partial days earn
// partial XP; overachieving caps at 150 XP/day. Inflating task points can't inflate your level.
// Curve: level n → n+1 costs 50*(n+1) XP, so L2 = first won day, L5 ≈ a week, L10 ≈ a month.
const RANKS = [[1, "ROOKIE"], [5, "GRINDER"], [10, "OPERATOR"], [15, "MACHINE"], [20, "RELENTLESS"], [30, "UNSTOPPABLE"], [40, "LEGEND"], [50, "GOAT"]];
function dayXP(score, goal) {
  const g = Math.max(1, goal || 200);
  return Math.round(Math.min(Math.max(0, score) / g, 1.5) * 100);
}
function levelFromPoints(xp) {
  let level = 1, need = 100, cum = 0;
  while (xp >= cum + need && level < 99) { cum += need; level++; need = 50 * (level + 1); }
  return { level, intoLevel: Math.max(0, xp - cum), needed: need };
}
function rankForLevel(level) { let r = RANKS[0][1]; for (const [l, name] of RANKS) { if (level >= l) r = name; } return r; }
function lifetimePoints(data, todayScore) {
  return Object.values(data.history || {}).reduce((s, h) => s + dayXP(h.score || 0, h.goal), 0) + dayXP(todayScore, data.dailyGoal);
}

// Store: default rewards, priced off the user's daily goal so they're "costly"
// relative to how much a real day earns. Wallet = raw points earned minus spent;
// spending never touches XP or level — those are lifetime-permanent.
function mkStoreDefaults(goal) {
  const g = Math.max(50, goal || 100);
  const r10 = (x) => Math.max(10, Math.round(x / 10) * 10);
  return [
    { id: "st_sleepin", name: "Sleep In", price: r10(g * 0.75) },
    { id: "st_skipgym", name: "Skip the Gym", price: r10(g * 1) },
    { id: "st_friends", name: "Hang Out With Friends", price: r10(g * 1) },
    { id: "st_rest", name: "Rest Day", price: r10(g * 1.5) },
    { id: "st_cheat", name: "Cheat Day", price: r10(g * 2) },
  ];
}
function totalEarnedPoints(data, todayScore) {
  return Object.values(data.history || {}).reduce((s, h) => s + (h.score || 0), 0) + todayScore;
}

function allHabits(secs) { return secs.flatMap((s) => s.items); }
// Required habits (every section except the optional one) cost their points when a day marks them ✗,
// including habits still unmarked when the day closes (they get stamped ✗). Optional habits only ever add.
// The penalty starts on the day the rule was introduced; earlier days keep the scores they had.
const HABIT_PENALTY_FROM = "2026-09-25";
function habitPoints(status, item, optional, date) {
  if (status === "done") return item.points;
  if (status === "skip" && !optional && typeof date === "string" && date >= HABIT_PENALTY_FROM) return -item.points;
  return 0;
}
function sectionScore(tl, sec, date) { return sec.items.reduce((sc, i) => sc + habitPoints(tl[i.id], i, sec.optional === true, date), 0); }
function habitScore(tl, secs, date) { return secs.reduce((sc, sec) => sc + sectionScore(tl, sec, date), 0); }
function requiredHabits(secs) { return secs.filter((s) => s.optional !== true).flatMap((s) => s.items); }
// Optional sections always sit below the required ones.
function orderedHabitSections(secs) { return [...secs.filter((s) => s.optional !== true), ...secs.filter((s) => s.optional === true)]; }
function taskScore(lists, today) { return lists.flatMap((l) => l.items).reduce((sc, t) => sc + ((t.done && (!t.doneDate || t.doneDate === today)) ? t.points : 0), 0); }
function getStreak(id, log, today) {
  if (log[today]?.[id] !== "done") return 0; let s = 1;
  const d = new Date(today + "T12:00:00");
  for (let i = 1; i < 365; i++) { const p = new Date(d); p.setDate(d.getDate() - i); if (log[localDateStr(p)]?.[id] === "done") s++; else break; }
  return s;
}
function getOverall(id, log) { const ds = Object.keys(log); if (!ds.length) return 0; return Math.round((ds.filter((d) => log[d]?.[id] === "done").length / ds.length) * 100); }
const statusCycle = [undefined, "done", "skip", "neutral"];

function taskDeadlinesForDate(taskLists, dateStr) {
  const deadlines = [];
  for (const list of taskLists || []) {
    for (const task of list.items || []) {
      if (task.done || typeof task.deadline !== "string") continue;
      const match = /^(\d{4}-\d{2}-\d{2})(?:T([01]\d|2[0-3]):([0-5]\d))?$/.exec(task.deadline);
      if (!match || match[1] !== dateStr) continue;
      const [year, month, day] = match[1].split("-").map(Number);
      const date = new Date(year, month - 1, day);
      if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) continue;
      deadlines.push({ listId: list.id, task, time: match[2] ? `${match[2]}:${match[3]}` : "" });
    }
  }
  return deadlines.sort((a, b) => a.time.localeCompare(b.time) || a.task.name.localeCompare(b.task.name));
}

function deadlineChip(deadline) {
  if (!deadline) return null;
  const hasTime = deadline.includes("T");
  const due = new Date(deadline + (hasTime ? "" : "T23:59:59"));
  const now = new Date();
  const dayMs = 24 * 60 * 60 * 1000;
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const dueStart = new Date(due); dueStart.setHours(0,0,0,0);
  const diffDays = Math.round((dueStart - todayStart) / dayMs);
  const fmtTime = (d) => { const h = d.getHours(); const m = d.getMinutes(); const ampm = h >= 12 ? "p" : "a"; const hr = h > 12 ? h-12 : h || 12; return `${hr}${m ? ":"+String(m).padStart(2,"0") : ""}${ampm}`; };
  // Always show the exact date that was entered (device-local, year only when it is not this year);
  // Today / Tmrw / weekday stay as a prefix so the relative cue is not lost.
  const exact = `${due.getMonth()+1}/${due.getDate()}${due.getFullYear() !== now.getFullYear() ? "/" + String(due.getFullYear()).slice(-2) : ""}${hasTime ? " " + fmtTime(due) : ""}`;
  if (due < now) {
    const daysLate = Math.max(1, Math.ceil((now - due) / dayMs));
    return { text: `⚠ ${daysLate}d late · ${exact}`, color: "#ff4757", bg: "#ff475722", border: "#ff475755" };
  }
  if (diffDays === 0) return { text: `📅 Today ${exact}`, color: "#ffa502", bg: "#ffa50222", border: "#ffa50255" };
  if (diffDays === 1) return { text: `📅 Tmrw ${exact}`, color: "#ffa502", bg: "#ffa50222", border: "#ffa50255" };
  if (diffDays < 7) return { text: `📅 ${due.toLocaleDateString("en-US", { weekday: "short" })} ${exact}`, color: "#8b8b9e", bg: "#2d2d3a", border: "#3d3d4a" };
  return { text: `📅 ${exact}`, color: "#8b8b9e", bg: "#2d2d3a", border: "#3d3d4a" };
}

function fmtDoneDate(d) {
  if (!d) return "";
  try { return new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }); }
  catch (e) { return ""; }
}

// Calendar event colors: one clearly different hue per swatch, ordered around the color wheel.
const CAL_COLORS = [
  { name: "Red", hex: "#e53935" }, { name: "Coral", hex: "#ff7a6b" }, { name: "Orange", hex: "#fb8c00" },
  { name: "Yellow", hex: "#fdd835" }, { name: "Green", hex: "#2e9d58" }, { name: "Teal", hex: "#00a39a" },

  { name: "Pink", hex: "#e84393" }, { name: "Brown", hex: "#8d6e63" }, { name: "Graphite", hex: "#636e72" },
];
const CAL_DEFAULT_COLOR = "#1e88e5";
// Dark text on light backgrounds (yellow, coral), white everywhere else.
function calTextColor(hex) {
  const match = /^#([0-9a-f]{6})$/i.exec(hex || "");
  if (!match) return "#fff";
  const [r, g, b] = match[1].match(/.{2}/g).map(part => parseInt(part, 16) / 255);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.6 ? "#1a1a2e" : "#fff";
}
function CalColorPicker({ value, onChange }) {

// Side-by-side layout for one day column (Google Calendar style). items: [{ key, start, end }] in minutes.
// Events that overlap, directly or through a chain, form a cluster; each event takes the first sub-column
// that is free at its start, and every event in the cluster gets the cluster's column count.
// Returns Map key -> { col, cols }.
function layoutDayEvents(items) {
  const layout = new Map();
  const sorted = [...items].sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
  let cluster = [], columnEnds = [], clusterEnd = -Infinity;
  const flush = () => { for (const { key, col } of cluster) layout.set(key, { col, cols: columnEnds.length }); cluster = []; columnEnds = []; };
  for (const item of sorted) {
    if (item.start >= clusterEnd) { flush(); clusterEnd = -Infinity; }
    let col = columnEnds.findIndex(end => end <= item.start);
    if (col === -1) { col = columnEnds.length; columnEnds.push(item.end); } else columnEnds[col] = item.end;
    cluster.push({ key: item.key, col });
    clusterEnd = Math.max(clusterEnd, item.end);
  }
  flush();
  return layout;
}

function taskElapsedSeconds(task, now = Date.now()) {
  const saved = Math.max(0, Number(task.trackedSeconds) || 0);
  const startedAt = Number(task.timerStartedAt);
  if (!Number.isFinite(startedAt) || startedAt <= 0) return saved;
  return saved + Math.max(0, Math.floor((now - startedAt) / 1000));
}

function stopTaskTimer(task, now = Date.now()) {
  if (!task.timerStartedAt) return task;
  const stopped = { ...task, trackedSeconds: taskElapsedSeconds(task, now) };
  delete stopped.timerStartedAt;
  return stopped;
}

function fmtTaskDuration(seconds) {
  const total = Math.max(0, Math.floor(Number(seconds) || 0));
  const hours = Math.floor(total / 3600);
  const minutes = Math.floor((total % 3600) / 60);
  const secs = total % 60;
  return hours > 0
    ? `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`
    : `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
}

function finishedTasksForDay(taskLists, day) {
  const result = new Map();
  for (const list of taskLists || []) {
    for (const task of list.items || []) {
      if (!task.done || task.doneDate !== day) continue;
      result.set(`${task.id}:${day}`, { id: `${task.id}:${day}`, name: task.name, listTitle: list.title,
        points: Math.max(0, Number(task.points) || 0), trackedSeconds: Math.max(0, Number(task.trackedSeconds) || 0) });
    }
  }
  for (const list of taskLists || []) {
    for (const entry of list.completedLog || []) {
      if (entry.date !== day) continue;
      const taskId = entry.id?.startsWith("c_") && entry.id.endsWith(`_${day}`)
        ? entry.id.slice(2, -(day.length + 1)) : entry.id;
      const id = `${taskId}:${day}`;
      if (!result.has(id)) result.set(id, { id, name: entry.name, listTitle: list.title,
        points: Math.max(0, Number(entry.points) || 0), trackedSeconds: Math.max(0, Number(entry.trackedSeconds) || 0) });
    }
  }
  return [...result.values()];
}

function watchCalendarClock(onTick) {
  let timer, stopped = false;
  const refresh = () => {
    if (stopped) return;
    onTick(Date.now());
    clearTimeout(timer);
    // Read the actual clock again each time; suspended tabs must not count missed ticks.
    timer = setTimeout(refresh, 60000 - (Date.now() % 60000) + 20);
  };
  window.addEventListener("focus", refresh);
  window.addEventListener("pageshow", refresh);
  document.addEventListener("visibilitychange", refresh);
  refresh();
  return () => {
    stopped = true; clearTimeout(timer);
    window.removeEventListener("focus", refresh);
    window.removeEventListener("pageshow", refresh);
    document.removeEventListener("visibilitychange", refresh);
  };
}

function calendarNowPosition(now, dates, startHour, endHour) {
  const displayDate = new Date(now);
  let minutes = now.getHours() * 60 + now.getMinutes();
  // Same rule as the events: early hours sit under the previous day only when this day's column does not show them.
  if (endHour >= 24 && now.getHours() < Math.min(endHour - 24 + 1, startHour)) {
    displayDate.setDate(displayDate.getDate() - 1);
    minutes += 1440;
  }
  const dayIndex = dates.findIndex(date => localDateStr(date) === localDateStr(displayDate));
  const offset = minutes - startHour * 60;
  if (dayIndex < 0 || offset < 0 || offset > (endHour - startHour + 1) * 60) return null;
  return { dayIndex, offset };
}

function nextFinishedTasksReset(resetHour, now = new Date()) {
  const next = new Date(now);
  next.setHours(resetHour || 0, 0, 0, 0);
  if (next <= now) next.setDate(next.getDate() + 1);
  return next.getTime() - now.getTime() + 50;
}

function TodaysFinishedTasks({ taskLists, resetHour }) {
  const [day, setDay] = useState(() => getToday(resetHour));
  useEffect(() => {
    let timer;
    const refresh = () => {
      setDay(getToday(resetHour));
      clearTimeout(timer);
      timer = setTimeout(refresh, nextFinishedTasksReset(resetHour));
    };
    refresh();
    window.addEventListener("focus", refresh);
    document.addEventListener("visibilitychange", refresh);
    return () => { clearTimeout(timer); window.removeEventListener("focus", refresh); document.removeEventListener("visibilitychange", refresh); };
  }, [resetHour]);
  const finished = finishedTasksForDay(taskLists, day);
  const points = finished.reduce((total, task) => total + task.points, 0);
  return <section aria-label="Today's finished tasks" data-today-finished style={{ ...S.card, marginTop: 24, borderColor: "#4cd13744" }}>

    {finished.length ? <div style={{ maxHeight: 360, overflowY: "auto" }}>

function TaskWorkTimer({ task, onToggle }) {
  const startedAt = Number(task.timerStartedAt);
  const running = Number.isFinite(startedAt) && startedAt > 0;
  const [now, setNow] = useState(Date.now());

  useEffect(() => {
    setNow(Date.now());
    if (!running) return;
    const interval = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(interval);
  }, [running, startedAt]);

  const elapsed = taskElapsedSeconds(task, now);
  return (
    <div style={{ display: "flex", alignItems: "center", marginTop: 5, minHeight: 22 }}>
      {/* One quiet control: play/stop plus the tracked time; it only lights up while running. */}
      <button
        onClick={onToggle}
        aria-label={`${running ? "Stop" : "Start"} timer for ${task.name}`}
        aria-pressed={running}
        title={running ? "Stop tracking time" : "Start tracking time"}
        style={{
          display: "inline-flex", alignItems: "center", gap: 6,
          background: running ? "#00ff8714" : "transparent",
          border: `1px solid ${running ? "#00ff8755" : "#2f2f44"}`,
          borderRadius: 999,
          color: running ? "#5ff0a6" : "#9a9aae",
          cursor: "pointer",
          fontFamily: "inherit",
          fontSize: 11.5,
          fontWeight: 600,
          padding: "3px 10px 3px 8px",

          ? <span aria-hidden="true" style={{ display: "inline-block", width: 7, height: 7, borderRadius: 2, background: "#5ff0a6", boxShadow: "0 0 8px #00ff87" }} />
          : <span aria-hidden="true" style={{ fontSize: 9, color: "#a78bfa" }}>{"\u25B6"}</span>}
        {elapsed > 0 || running ? <span className="num">{fmtTaskDuration(elapsed)}</span> : "Start timer"}
      </button>
    </div>
  );
}

function NoteScreenshot({ image, onRemove }) {
  const [src, setSrc] = useState("");
  const [error, setError] = useState("");
  const [attempt, setAttempt] = useState(0);
  const [message, setMessage] = useState("");
  const [busy, setBusy] = useState(false);
  useEffect(() => {
    let canceled = false;
    setSrc(""); setError("");
    window.noteImageStore.load(image.assetId).then(data => { if (!canceled) setSrc(data); }).catch(err => { if (!canceled) setError(err.message); });
    return () => { canceled = true; };
  }, [image.assetId, attempt]);
  const pngBlob = async () => {
    const img = new Image();
    await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = src; });
    const canvas = document.createElement("canvas"); canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
    canvas.getContext("2d").drawImage(img, 0, 0);
    return new Promise((resolve, reject) => canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("Could not copy image.")), "image/png"));
  };
  return <figure data-note-screenshot={image.id} style={{ margin: "0 0 18px", padding: 12, border: "1px solid #353548", borderRadius: 10, background: "#141423" }}>
    <figcaption style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: 8, marginBottom: 10 }}>
      <span style={{ flex: 1, minWidth: 100, fontSize: 11, color: "#b5b5c9", overflowWrap: "anywhere" }}>{image.name}</span>
      {src && <button type="button" style={S.noteToolBtn} onClick={async () => {
        setMessage("");
        try {
          if (!navigator.clipboard?.write || !window.ClipboardItem) throw new Error("This browser cannot copy images. Long-press or right-click the screenshot to copy it.");
          await navigator.clipboard.write([new ClipboardItem({ "image/png": pngBlob() })]); setMessage("Image copied.");
        } catch (err) { setMessage(err.message || "Copy was blocked. Long-press or right-click the image to copy it."); }
      }}>Copy image</button>}
      <button type="button" disabled={busy} style={{ ...S.noteToolBtn, color: "#ff8793" }} onClick={async () => { setBusy(true); try { await onRemove(image.id); } catch (err) { setMessage(err.message); } finally { setBusy(false); } }}>Remove image</button>
    </figcaption>
    {src ? <img src={src} alt={image.name} width={image.width} height={image.height} style={{ display: "block", maxWidth: "100%", height: "auto", borderRadius: 4 }} /> : <div role="status" style={{ color: "#aaaabb", padding: 20, fontSize: 12 }}>{error || "Loading screenshot…"}{error && <button onClick={() => setAttempt(value => value + 1)} style={{ ...S.noteToolBtn, marginLeft: 8 }}>Retry</button>}</div>}
    {message && <p role="status" style={{ color: "#c4b5fd", fontSize: 11, marginTop: 8 }}>{message}</p>}
  </figure>;
}

function CalendarReminders() {
  const [status, setStatus] = useState({ state: "loading" });
  const [busy, setBusy] = useState(false);
  const [message, setMessage] = useState("");
  useEffect(() => {
    let mounted = true;
    window.calendarReminders.status().then(value => { if (mounted) setStatus(value); })
      .catch(error => { if (mounted) { setStatus({ state: "error" }); setMessage(error.message); } });
    return () => { mounted = false; };
  }, []);
  async function perform(action) {
    setBusy(true); setMessage("");
    try {
      // Do not await before enable(): iPhone requires the original click gesture.
      const result = await window.calendarReminders[action]();
      if (result) setStatus(result);
      if (action === "test") setMessage("Test sent. Check this device’s notifications.");
    } catch (error) { setMessage(error.message); }
    finally { setBusy(false); }
  }
  const on = status.state === "on";
  const buttonStyle = { padding: "10px 12px", borderRadius: 8, border: "1px solid #6550ab", background: "#7c3aed22", color: "#ddd3ff", fontSize: 12, cursor: busy ? "wait" : "pointer", fontFamily: "inherit" };
  return <section aria-label="Calendar reminders" style={{ borderTop: "1px solid #343447", marginTop: 18, paddingTop: 16, marginBottom: 18 }}>
    <h4 style={{ margin: "0 0 8px", fontSize: 13, color: "#f0f0f4" }}>Calendar reminders</h4>
    <p style={{ fontSize: 12, color: "#b5b5c9", lineHeight: 1.6, margin: "0 0 12px" }}>Get a notification on this device 10 minutes before each calendar event, including repeating events. Enable this separately on your iPhone and computer.</p>
    {status.state === "install" ? <p style={{ fontSize: 12, color: "#ddd3ff", lineHeight: 1.6 }}>On iPhone: open Organized Me in Safari, tap Share → Add to Home Screen, then open that icon and enable reminders here.</p>
      : status.state === "unsupported" ? <p style={{ fontSize: 12 }}>This browser does not support push notifications. Try Safari, Chrome, Edge, or Firefox on a supported device.</p>
      : status.state === "blocked" ? <p style={{ fontSize: 12, color: "#f3c794" }}>Notifications are blocked. Allow them in your browser or device notification settings, then reopen Organized Me.</p>
      : <>
        <div role="status" style={{ fontSize: 12, color: on ? "#8cdeb2" : "#b5b5c9", marginBottom: 10 }}>{status.state === "loading" ? "Checking reminders…" : on ? "Reminders are on for this device" : "Reminders are off for this device"}</div>
        {status.timeZone && <div style={{ fontSize: 11, color: "#b5b5c9", marginBottom: 12 }}>Calendar time zone: {status.timeZone}. Both devices use this time zone for reminders.</div>}
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {status.state === "error" ? <button disabled={busy} onClick={() => perform("status")} style={buttonStyle}>Retry setup check</button>
            : <button disabled={busy || status.state === "loading"} onClick={() => perform(on ? "disable" : "enable")} style={buttonStyle}>{busy ? "Working…" : on ? "Turn off on this device" : "Enable on this device"}</button>}
          {on && <button disabled={busy} onClick={() => perform("test")} style={buttonStyle}>Send test notification</button>}
        </div>
      </>}
    {message && <p role="status" style={{ fontSize: 12, color: "#f3c794", lineHeight: 1.6, marginBottom: 0 }}>{message}</p>}
  </section>;
}

function reminderWeekOffset(date) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date || "")) return 0;
  const target = new Date(date + "T12:00:00");
  if (!Number.isFinite(target.getTime())) return 0;
  const monday = (day) => Date.UTC(day.getFullYear(), day.getMonth(), day.getDate() - (day.getDay() + 6) % 7);
  return Math.round((monday(target) - monday(new Date())) / 604800000);
}

function SaveIndicator({ info, onRetry }) {
  if (!info || info.state === "idle") return null;
  const offline = info.state === "error" && typeof navigator !== "undefined" && navigator.onLine === false;
  const isError = info.state === "error" && !offline;
  const color = isError ? "#ff6b78" : offline || info.state === "saving" ? "#ffd43b" : "#00b86b";
  const label = offline ? "● SAVED ON DEVICE · OFFLINE, WILL SYNC" : isError ? "⚠ CLOUD SYNC FAILED · TAP TO RETRY" : info.state === "saving" ? "● SAVED ON DEVICE · SYNCING..." : "✓ SAVED";
  return (
    <button
      onClick={isError ? onRetry : undefined}
      title={isError ? (info.error || "Your change is safe on this device. Tap to retry cloud sync.") : label}
      style={{ background: "none", border: "none", color, cursor: isError ? "pointer" : "default", fontFamily: "inherit", fontSize: 10, fontWeight: 800, letterSpacing: 1.2, marginTop: 5, padding: 0 }}
    >
      {label}
    </button>
  );
}

    taskSavingRef.current = false;
    setTaskSaving(false);
    if (document.visibilityState === "visible") setTimeout(() => inputRef.current?.focus(), 50);
    return result;
  }, [list.id, onAdd]);

  // Recover a task that was being typed if the browser previously closed
  // before Enter/blur could commit it to the main task list.
  useEffect(() => {
    if (!restoreDraftRef.current) return;
    restoreDraftRef.current = false;
    // A leftover journal entry for a task that is already in the lists, or that was deleted, is stale:
    // drop it instead of adding the task again.
    const state = taskState ? taskState(draftIdRef.current) : "unknown";
    if (state !== "unknown") {
      clearTaskDraft(list.id);
      draftIdRef.current = makeId("t");
      textRef.current = ""; ptsRef.current = "";
      setText(""); setPts("");
      return;
    }
    commitDraft();
  }, [commitDraft]);

  // Closing or hiding the page must not discard an in-progress task. The
  // parent save writes to the device synchronously before cloud sync begins.
  useEffect(() => {
    const flushDraft = () => { commitDraft(); };
    const onVisibilityChange = () => {
      if (document.visibilityState === "hidden") flushDraft();
    };
    const warnBeforeClose = (event) => {
      if (!taskSavingRef.current && !textRef.current.trim()) return;
      event.preventDefault();
      event.returnValue = "";
    };
    window.addEventListener("pagehide", flushDraft);
    window.addEventListener("beforeunload", warnBeforeClose);
    document.addEventListener("visibilitychange", onVisibilityChange);
    return () => {
      window.removeEventListener("pagehide", flushDraft);
      window.removeEventListener("beforeunload", warnBeforeClose);
      document.removeEventListener("visibilitychange", onVisibilityChange);
    };
  }, [commitDraft]);

  const isTaskDropTarget = !!taskDrag && taskDrag.targetListId === list.id;
  const pendingDropItems = taskDrag ? pending.filter((item) => item.id !== taskDrag.taskId) : pending;

  return (
    <div data-tasklist={list.id} data-tasklistrow={listIdx} style={{
      ...S.taskList,
      border: isTaskDropTarget ? "2px solid #7c3aed" : S.taskList.border,
      background: isTaskDropTarget ? "#201d35" : S.taskList.background,
      transform: listDragging ? `translateY(${listDragOffset}px) scale(1.01)` : "none",
      transition: listDragging ? "none" : "transform 0.15s",
      boxShadow: listDragging || isTaskDropTarget ? "0 14px 32px rgba(124,58,237,0.32)" : (S.taskList.boxShadow || "none"),
      zIndex: listDragging ? 50 : "auto",
      position: "relative",
      opacity: listDragging ? 0.95 : 1,
    }}>
      <div style={S.tlHead}>
        <span
          onPointerDown={handleListDragStart}
          onTouchStart={handleListDragStart}
          style={{ cursor: "grab", color: "#8b8b9e", fontSize: 22, padding: "0 10px 0 0", userSelect: "none", touchAction: "none", lineHeight: 1, fontWeight: 900, letterSpacing: -2 }}
          title="Drag to reorder list"
        >{"\u22EE"}</span>
        <span style={S.tlTitle}>{list.title}{list.resetsDaily && <span style={{ fontSize: 10.5, color: "#7c3aed", marginLeft: 6, fontWeight: 700 }}>{"\u21BB"} Daily</span>}</span>
        <button onClick={() => onDeleteList(list.id)} style={S.tlDel} title="Delete list">&times;</button>
      </div>

      {pending.map((t, i) => {
        const isMe = !!taskDrag && taskDrag.sourceListId === list.id && taskDrag.taskId === t.id;
        const isDragging = !!taskDrag;
        const showDropBefore = isTaskDropTarget && taskDrag.targetIndex === pendingDropItems.findIndex((item) => item.id === t.id);
        return (
        <div key={t.id} data-taskrow={i} data-task-id={t.id} style={{
          ...S.tRow,
          borderTop: showDropBefore && !isMe ? "2px solid #a78bfa" : "none",
          transform: isMe ? `translateY(${taskDrag.offset}px) scale(1.02)` : "none",
          transition: isMe ? "none" : "transform 0.15s",
          boxShadow: isMe ? "0 10px 24px rgba(124,58,237,0.45)" : "none",
          background: isMe ? "#1a1a2e" : (S.tRow.background || "transparent"),
          zIndex: isMe ? 50 : "auto",
          position: "relative",
          opacity: isMe ? 0.95 : 1,
          pointerEvents: isDragging && !isMe ? "none" : "auto",
        }}>
          <button
            type="button"
            aria-label={`Drag ${t.name} to reorder or move lists`}
            onPointerDown={(e) => handleDragStart(e, i)}
            onTouchStart={(e) => handleDragStart(e, i)}
            style={{ cursor: "grab", color: "#8b8b9e", fontSize: 18, padding: "0 6px 0 0", userSelect: "none", touchAction: "none", lineHeight: 1, fontWeight: 900, background: "none", border: "none", fontFamily: "inherit" }}
            title="Drag to reorder or move to another list"
          >{"\u22ee"}</button>
          <button className="hit-expand check-hit" onClick={() => onToggle(list.id, t.id)} aria-label={`Complete ${t.name}`} title="Complete" style={S.tCircle} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
              <span style={{ ...S.tText, flex: "0 1 auto" }}>{t.name}</span>
              {(() => { const chip = deadlineChip(t.deadline); if (!chip) return null; const late = chip.text.startsWith("\u26A0"); return <span style={{ display: "inline-flex", alignItems: "center", gap: 5, padding: "2px 8px", borderRadius: 999, fontSize: 11, fontWeight: 700, color: chip.color, background: chip.bg, border: `1px solid ${chip.border}`, whiteSpace: "nowrap" }}><Icon name={late ? "alert" : "calendar"} size={12} stroke={2.4} />{chip.text.replace(/^(\u{1F4C5}|\u26A0)\s*/u, "")}</span>; })()}
            </div>
            <TaskWorkTimer task={t} onToggle={() => onToggleTimer(list.id, t.id)} />
          </div>
          {t.points > 0 && <span style={S.tPts}>+{t.points}</span>}
          <button className="icon-btn" onClick={() => onEdit && onEdit(list.id, t)} style={{ background: "none", border: "none", cursor: "pointer", color: "#8b8b9e", padding: 0 }} title="Edit task" aria-label={`Edit ${t.name}`}><Icon name="pencil" size={15} /></button>
          <button className="icon-btn" onClick={() => onDelete(list.id, t.id)} style={{ ...S.tX, padding: 0 }} title="Delete task" aria-label={`Delete ${t.name}`}><Icon name="x" size={16} /></button>
        </div>
        );
      })}

      {isTaskDropTarget && pendingDropItems.length === 0 && (
        <div style={{ margin: "8px 0", padding: "14px", border: "2px dashed #a78bfa", borderRadius: 10, color: "#c4b5fd", fontSize: 10, fontWeight: 800, letterSpacing: 1.5, textAlign: "center" }}>DROP TASK HERE</div>
      )}
      {isTaskDropTarget && taskDrag.targetIndex === pendingDropItems.length && pendingDropItems.length > 0 && (
        <div style={{ height: 2, background: "#a78bfa", borderRadius: 2, margin: "2px 0 8px", boxShadow: "0 0 10px #7c3aed" }} />
      )}

      <div style={S.tAddRow} onBlur={(event) => {
        if (!event.currentTarget.contains(event.relatedTarget)) commitDraft();
      }}>
        <button type="button" onClick={commitDraft} disabled={taskSaving} style={{ ...S.tAddIcon, background: "none", border: "none", cursor: taskSaving ? "wait" : "pointer", fontFamily: "inherit", opacity: taskSaving ? 0.5 : 1 }} aria-label={`Save task in ${list.title}`}>+</button>
        <input ref={inputRef} style={S.tAddInp} placeholder={taskSaving ? "Saving task to cloud..." : "Add a task"} value={text} disabled={taskSaving}
          onChange={(e) => {
            const next = e.target.value;
            textRef.current = next;
            setText(next);
            if (next.trim()) writeTaskDraft(list.id, { id: draftIdRef.current, name: next, points: ptsRef.current });
            else clearTaskDraft(list.id);
          }}
          onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); commitDraft(); } }} />
        <input style={S.tAddPts} placeholder="pts" type="number" value={pts} disabled={taskSaving}
          onChange={(e) => {
            const next = e.target.value;
            ptsRef.current = next;
            setPts(next);
            if (textRef.current.trim()) writeTaskDraft(list.id, { id: draftIdRef.current, name: textRef.current, points: next });
          }}
          onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); commitDraft(); } }} />
        <button type="button" onClick={commitDraft} disabled={taskSaving || !text.trim()} style={{ background: taskSaving || !text.trim() ? "#2d2d3a" : "#7c3aed", color: taskSaving || !text.trim() ? "#666677" : "#fff", border: "none", borderRadius: 7, padding: "7px 10px", cursor: taskSaving ? "wait" : text.trim() ? "pointer" : "default", fontFamily: "inherit", fontSize: 10.5, fontWeight: 900, letterSpacing: 1, minWidth: 48 }}>{taskSaving ? "SAVING" : "ADD"}</button>
      </div>

      {completedAll.length > 0 && (
        <>
          <button onClick={() => setShowDone(!showDone)} style={S.compToggle}>
            <span style={{ marginRight: 6 }}>{showDone ? "\u25BE" : "\u25B8"}</span>
            Completed ({completedAll.length})
          </button>
          {showDone && completedView.map((c) => (
            <div key={c.key} style={{ ...S.tRow, opacity: 0.55, alignItems: "flex-start" }}>
              <button onClick={() => { if (c.live) onToggle(list.id, c.taskId); }} title={c.live ? "Tap to un-complete" : "Completed (history)"}
                style={{ ...S.tCircle, background: "#4cd137", borderColor: "#4cd137", cursor: c.live ? "pointer" : "default", marginTop: 2 }}>
                <span style={{ fontSize: 10, color: "#fff" }}>{"\u2713"}</span>
              </button>
              <div style={{ flex: 1, minWidth: 0 }}>
                <span style={{ ...S.tText, textDecoration: "line-through", color: "#8b8b9e", display: "block" }}>{c.name}</span>
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 2 }}>
                  {c.date && <span style={{ fontSize: 10.5, color: "#555566", letterSpacing: 0.5 }}>Completed: {fmtDoneDate(c.date)}</span>}
                  {c.trackedSeconds > 0 && <span style={{ fontSize: 10.5, color: "#00b86b", letterSpacing: 0.5 }}>⏱ {fmtTaskDuration(c.trackedSeconds)} worked</span>}
                </div>
              </div>
              {c.points > 0 && <span style={{ ...S.tPts, color: "#b0b0be", marginTop: 2 }}>+{c.points}</span>}
              <button onClick={() => { if (c.live) onDelete(list.id, c.taskId); else onDeleteCompleted(list.id, c.key); }} style={{ ...S.tX, marginTop: 2 }}>&times;</button>
            </div>
          ))}
          {showDone && completedAll.length > completedShown && (
            <button onClick={() => setCompletedShown(completedShown + 10)} style={{ ...S.compToggle, color: "#7c3aed", fontWeight: 700, justifyContent: "center", width: "100%" }}>
              {"\u21BB"} Load more ({completedAll.length - completedShown} more)
            </button>
          )}
        </>
      )}
    </div>
  );
}

function moveHabitById(items, habitId, targetId, after) {
  const source = items.findIndex(item => item.id === habitId);
  if (source < 0 || habitId === targetId || !items.some(item => item.id === targetId)) return items;
  const next = [...items];
  const [moved] = next.splice(source, 1);
  const target = next.findIndex(item => item.id === targetId);
  next.splice(target + (after ? 1 : 0), 0, moved);
  return next;
}

function startHabitPointerDrag(event, options) {
  const { sessionRef, sectionId, habitId, onPreview, onDrop } = options;
  if (sessionRef.current || event.isPrimary === false || event.button !== 0) return null;
  const handle = event.currentTarget;
  const section = handle.closest("[data-habitsec]");
  if (!section) return null;
  const rows = [...section.querySelectorAll("[data-habit-id]")].map(row => {
    const rect = row.getBoundingClientRect();
    return { id: row.dataset.habitId, mid: rect.top + rect.height / 2 + window.scrollY };
  });
  const sourceIndex = rows.findIndex(row => row.id === habitId);
  if (sourceIndex < 0) return null;
  event.preventDefault(); event.stopPropagation();
  const pointerId = event.pointerId, startY = event.clientY, startScrollY = window.scrollY;
  let currentY = startY, targetIndex = sourceIndex, finished = false, moved = false;
  let stopAutoScroll = () => {};
  const preview = () => {
    if (finished) return;
    const offset = currentY - startY + window.scrollY - startScrollY;
    if (Math.abs(offset) >= 4) moved = true;
    if (moved) targetIndex = rows.reduce((closest, row, i) => Math.abs(currentY + window.scrollY - row.mid) < Math.abs(currentY + window.scrollY - rows[closest].mid) ? i : closest, sourceIndex);
    onPreview({ secId: sectionId, habitId, dragIdx: sourceIndex, dropIdx: targetIndex, dropId: rows[targetIndex].id, offset });
  };
  const finish = commit => {
    if (finished) return;
    finished = true;
    stopAutoScroll();
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onCancel);
    document.removeEventListener("visibilitychange", onVisibility);
    handle.removeEventListener("lostpointercapture", onLostCapture);
    window.removeEventListener("blur", onBlur);
    if (sessionRef.current === session) sessionRef.current = null;
    try { if (handle.hasPointerCapture?.(pointerId)) handle.releasePointerCapture(pointerId); } catch (_) {}
    onPreview(null);
    if (commit && moved && targetIndex !== sourceIndex) onDrop(sectionId, habitId, rows[targetIndex].id, targetIndex > sourceIndex);
  };
  const onMove = ev => { if (ev.pointerId !== pointerId) return; if (ev.cancelable) ev.preventDefault(); currentY = ev.clientY; preview(); };
  const onUp = ev => { if (ev.pointerId === pointerId) finish(true); };
  const onCancel = ev => { if (ev.pointerId === pointerId) finish(false); };
  const onLostCapture = ev => { if (ev.pointerId === pointerId) finish(false); };
  const onBlur = () => finish(false);
  const onVisibility = () => { if (document.visibilityState === "hidden") finish(false); };
  const session = { habitId, sectionId, cancel: () => finish(false) };
  sessionRef.current = session;
  document.addEventListener("pointermove", onMove, { passive: false });
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onCancel);
  document.addEventListener("visibilitychange", onVisibility);
  handle.addEventListener("lostpointercapture", onLostCapture);
  window.addEventListener("blur", onBlur);
  try { handle.setPointerCapture(pointerId); } catch (_) {}
  preview();
  stopAutoScroll = startDragAutoScroll(() => currentY, preview);
  return session.cancel;
}

function HabitCard({ item, secId, idx, data, save, today, weekDates, tl, habitDrag, habitDragSessionRef, setHabitDrag, reorderHabit, openEditHabit }) {
  const streak = getStreak(item.id, data.log, today);
  const overall = getOverall(item.id, data.log);
  const todayNote = tl[item.id + "_note"] || "";
  const [showPicker, setShowPicker] = useState(false);
  const [showComment, setShowComment] = useState(false);
  const [commentText, setCommentText] = useState(todayNote);
  const [pickerDate, setPickerDate] = useState(today);
  const [showDesc, setShowDesc] = useState(false);
  const [showMonthly, setShowMonthly] = useState(false);
  const [monthOffset, setMonthOffset] = useState(0);
  const [selectedMonthDay, setSelectedMonthDay] = useState(null);
  const dragCleanupRef = useRef(null);
  useEffect(() => () => { dragCleanupRef.current?.(); }, []);

  function handleHabitDragStart(e) {
    const cleanup = startHabitPointerDrag(e, { sessionRef: habitDragSessionRef, sectionId: secId, habitId: item.id, onPreview: setHabitDrag, onDrop: reorderHabit });
    if (cleanup) dragCleanupRef.current = cleanup;
  }

  function pickStatus(st, dateOverride) {
    const targetDate = dateOverride || pickerDate;
    save((current) => {
      const dtl = current.log[targetDate] || {};
      const ntl = { ...dtl };
      if (st === undefined) { delete ntl[item.id]; }
      else ntl[item.id] = st;
      const nd = { ...current, log: { ...current.log, [targetDate]: ntl } };
      // Keep that day's archived history score in sync when editing the past
      const entry = current.history[targetDate];
      if (entry && targetDate !== today) {
        const hsBefore = habitScore(dtl, current.habitSections, targetDate);
        const ts = entry.ts !== undefined ? entry.ts : Math.max(0, (entry.score || 0) - hsBefore);
        const hsAfter = habitScore(ntl, current.habitSections, targetDate);
        const score = hsAfter + ts;
        nd.history = { ...current.history, [targetDate]: { ...entry, score, won: score >= (entry.goal || current.dailyGoal), ts } };
      }
      return nd;
    });
    if (!dateOverride) { setShowPicker(false); setShowComment(false); }
  }

  function saveComment() {
    const trimmed = commentText.trim();
    save((current) => {
      const ntl = { ...(current.log[pickerDate] || {}) };
      if (trimmed) ntl[item.id + "_note"] = trimmed;
      else delete ntl[item.id + "_note"];
      return { ...current, log: { ...current.log, [pickerDate]: ntl } };
    });
    setShowComment(false); setShowPicker(false);
  }

  const drag = habitDrag && habitDrag.secId === secId ? habitDrag : null;
  const isMe = !!drag && drag.habitId === item.id;
  const showTopMark = !!drag && drag.dropId === item.id && !isMe && drag.dragIdx > drag.dropIdx;
  const showBotMark = !!drag && drag.dropId === item.id && !isMe && drag.dragIdx < drag.dropIdx;
  return (
    <div data-habitrow={idx} data-habit-id={item.id} style={{
      ...S.card,
      borderTop: showTopMark ? "2px solid #7c3aed" : S.card.borderTop,
      borderBottom: showBotMark ? "2px solid #7c3aed" : S.card.borderBottom,
      transform: isMe ? `translateY(${drag.offset}px) scale(1.02)` : "none",
      transition: isMe ? "none" : "transform 0.15s",
      boxShadow: isMe ? "0 12px 30px rgba(124,58,237,0.45)" : "none",
      zIndex: isMe ? 50 : "auto",
      position: "relative",
      opacity: isMe ? 0.92 : 1,
      pointerEvents: drag && !isMe ? "none" : "auto",
    }}>
      <div style={{ display: "flex", alignItems: "flex-start" }}>
        <span
          onPointerDown={handleHabitDragStart}
          data-habit-drag-handle={item.id}
          style={{ cursor: "grab", color: "#8b8b9e", fontSize: 22, padding: "0 10px 0 2px", userSelect: "none", touchAction: "none", lineHeight: 1, alignSelf: "center", fontWeight: 900, letterSpacing: -2 }}
          title="Drag to reorder"
        >{"⋮"}</span>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={S.cardHead} onClick={() => openEditHabit(item, secId)}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <span style={S.cardName}>{item.name}</span>
            </div>
            <span style={S.cardPts}>+{item.points}</span>
          </div>
          <div style={S.cardMeta}>
            <span>Streak <span className="num" style={{ color: streak > 0 ? "#e6e6ee" : undefined }}>{streak}</span> {"\u00B7"} <span className="num">{overall}%</span> all-time</span>
            <button onClick={(event) => { event.stopPropagation(); setShowMonthly(!showMonthly); setMonthOffset(0); }} aria-expanded={showMonthly}
              style={{ marginLeft: "auto", background: "none", border: "none", color: showMonthly ? "#a78bfa" : "#77778a", fontSize: 12, cursor: "pointer", padding: "2px 0", fontFamily: "inherit" }}>
              {showMonthly ? "Hide month \u25B4" : "Month \u25BE"}
            </button>
          </div>
        </div>
        {item.desc && <button onClick={() => setShowDesc(!showDesc)} style={{ background: "none", border: "none", color: "#8b8b9e", fontSize: 18, cursor: "pointer", padding: "4px 2px 4px 8px", marginTop: 2, transition: "transform 0.2s", transform: showDesc ? "rotate(180deg)" : "rotate(0deg)" }}>{"▾"}</button>}
      </div>
      {item.desc && showDesc && <div style={S.cardDesc}>{item.desc}</div>}
      <div style={{ position: "relative" }}>
        <div style={S.week}>
          {weekDates.map((date, i) => {
            const st = data.log[date]?.[item.id];
            const nt = data.log[date]?.[item.id + "_note"];
            const isT = date === today, isF = date > today;
            let bg = "#2d2d3a", clr = "#aaaabb", bdr = "2px solid transparent", lbl = "";
            if (st === "done") { bg = "#4cd137"; clr = "#fff"; lbl = "✓"; }
            else if (st === "skip") { bg = "#e84118"; clr = "#fff"; lbl = "✗"; }
            else if (st === "neutral") { bg = "#636e72"; clr = "#fff"; lbl = "—"; }
            if (nt && !st) { bg = "#4cd13744"; bdr = "2px solid #4cd137"; lbl = "···"; clr = "#4cd137"; }
            else if (nt && st) { bdr = `2px solid ${st === "done" ? "#4cd137" : st === "skip" ? "#e84118" : "#636e72"}`; }
            if (!st && !nt && !isF) { lbl = "···"; clr = "#5a5a6e"; }
            if (isT) {
              bdr = "2px solid #c4b5fd";
              if (!st && !nt) { lbl = "···"; clr = "#c4b5fd"; }
            }
            return (
              <div key={date} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 3, flex: 1 }}>
                <button onClick={() => { if (isF) return; const sameDay = pickerDate === date; setPickerDate(date); setCommentText(data.log[date]?.[item.id + "_note"] || ""); setShowPicker(sameDay ? !showPicker : true); setShowComment(false); }} disabled={isF} style={{
                  width: 32, height: 32, borderRadius: 16, background: isF ? "#c0c0cc" : bg, color: clr, border: bdr,
                  fontSize: 11, fontWeight: 800, cursor: isF ? "default" : "pointer", fontFamily: "inherit",
                  display: "flex", alignItems: "center", justifyContent: "center", opacity: isF ? 0.2 : 1, transition: "all 0.15s", padding: 0,
                }}>{lbl}</button>
                <span style={{ fontSize: 11, color: isT ? "#a78bfa" : "#66667a", fontWeight: isT ? 800 : 600 }} aria-label={isT ? "Today" : undefined}>{DAYS[i]}</span>
              </div>
            );
          })}
        </div>
        {showPicker && (() => {
          const pickerNote = data.log[pickerDate]?.[item.id + "_note"] || "";
          const isPast = pickerDate !== today;
          const pickerDateObj = new Date(pickerDate + "T12:00");
          return (
          <div style={S.pickerWrap}>
            {isPast && (
              <div style={{ textAlign: "center", fontSize: 10.5, color: "#c4b5fd", letterSpacing: 1.2, fontWeight: 700, marginBottom: 6 }}>
                EDITING {pickerDateObj.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }).toUpperCase()}
              </div>
            )}
            <div style={S.picker}>
              <button onClick={() => pickStatus("done")} style={{ ...S.pickBtn, background: "#4cd137" }}>{"✓"}</button>
              <button onClick={() => pickStatus("skip")} style={{ ...S.pickBtn, background: "#e84118" }}>{"✗"}</button>
              <button onClick={() => pickStatus("neutral")} style={{ ...S.pickBtn, background: "#636e72" }}>{"—"}</button>
              <button onClick={() => pickStatus(undefined)} style={{ ...S.pickBtn, background: "#2d2d3a", color: "#8b8b9e" }}>{"×"}</button>
              <button onClick={() => { setShowComment(!showComment); setCommentText(pickerNote); }} style={{ ...S.pickBtn, background: "#1a1a2e", color: "#f8f8fa", border: pickerNote ? "3px solid #4cd137" : "none" }}>{"···"}</button>
            </div>
            {showComment && (
              <div style={S.commentRow}>
                <input style={S.commentInp} placeholder="Write a comment..." value={commentText} onChange={(e) => setCommentText(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") saveComment(); }} autoFocus />
                <button onClick={saveComment} style={S.commentSave}>{"✓"}</button>
              </div>
            )}
          </div>
          );
        })()}
      </div>
      {todayNote && !showPicker && (
        <div style={S.commentPreview} onClick={() => { setPickerDate(today); setShowPicker(true); setShowComment(true); setCommentText(todayNote); }}>
          {"📝"} {todayNote}
        </div>
      )}
      {showMonthly && (() => {
        const now = new Date();
        const viewDate = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
        const year = viewDate.getFullYear(), month = viewDate.getMonth();
        const monthName = viewDate.toLocaleString("default", { month: "long", year: "numeric" });
        const firstDay = (new Date(year, month, 1).getDay() + 6) % 7;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const dayNames = ["Mo","Tu","We","Th","Fr","Sa","Su"];
        const cells = [];
        for (let i = 0; i < firstDay; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) cells.push(d);
        while (cells.length % 7 !== 0) cells.push(null);
        // Drop trailing weeks that are entirely empty or all in the future, so the
        // grid ends at the current week and the editor sits right under it.
        while (cells.length > 7) {
          const lastWeek = cells.slice(-7);
          const allFutureOrEmpty = lastWeek.every(d => {
            if (d === null) return true;
            const ds = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
            return ds > today;
          });
          if (allFutureOrEmpty) cells.length -= 7; else break;
        }
        let doneCount = 0, skipCount = 0, totalDays = 0;
        for (let d = 1; d <= daysInMonth; d++) {
          const ds = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
          if (ds > today) break;
          totalDays++;
          const st = data.log[ds]?.[item.id];
          if (st === "done") doneCount++;
          else if (st === "skip") skipCount++;
        }
        return (
          <div style={{ marginTop: 8, padding: "10px 4px", borderTop: "1px solid #2d2d3a" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%", margin: "0 auto 10px" }}>

              <span style={{ fontSize: 13, fontWeight: 700, color: "#f0f0f4", letterSpacing: 1 }}>{monthName}</span>
              <button onClick={() => setMonthOffset(Math.min(monthOffset + 1, 0))} disabled={monthOffset >= 0} style={{ background: "none", border: "none", color: monthOffset >= 0 ? "#333" : "#8b8b9e", fontSize: 18, cursor: monthOffset >= 0 ? "default" : "pointer", padding: "4px 10px" }}>{"▶"}</button>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 6, textAlign: "center", width: "100%" }}>
              {dayNames.map(dn => <div key={dn} style={{ fontSize: 10, color: "#555566", fontWeight: 700, padding: "2px 0" }}>{dn}</div>)}
              {cells.map((d, i) => {
                if (d === null) return <div key={"e"+i} />;
                const ds = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
                const st = data.log[ds]?.[item.id];
                const nt = data.log[ds]?.[item.id + "_note"];
                const isFuture = ds > today;
                const isToday = ds === today;
                let bg = "#2d2d3a", clr = "#666";
                if (st === "done") { bg = "#4cd137"; clr = "#fff"; }
                else if (st === "skip") { bg = "#e84118"; clr = "#fff"; }
                else if (st === "neutral") { bg = "#636e72"; clr = "#fff"; }
                else if (nt) { bg = "#4cd13744"; clr = "#4cd137"; }
                return (
                  <div key={d} onClick={() => { if (isFuture) return; setSelectedMonthDay(selectedMonthDay === ds ? null : ds); }}
                    style={{ width: "100%", aspectRatio: "1", borderRadius: "50%", background: isFuture ? "#1a1a2e" : bg, color: isFuture ? "#333" : clr, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: isToday ? 900 : 600, border: selectedMonthDay === ds ? "2px solid #ffd43b" : isToday ? "2px solid #c4b5fd" : nt && !isFuture ? "2px dotted #a78bfa55" : "2px solid transparent", opacity: isFuture ? 0.3 : 1, cursor: isFuture ? "default" : "pointer" }}>{d}</div>
                );
              })}
            </div>
            {selectedMonthDay && (() => {
              const selDate = new Date(selectedMonthDay + "T12:00");
              const selStatus = data.log[selectedMonthDay]?.[item.id];
              const selNote = data.log[selectedMonthDay]?.[item.id + "_note"];
              return (
                <div style={{ marginTop: 6, padding: "10px 12px", background: "#12122a", borderRadius: 8, border: "1px solid #2d2d3a", width: "100%" }}>
                  <div style={{ fontSize: 10, color: "#c4b5fd", marginBottom: 8, display: "flex", justifyContent: "space-between", alignItems: "center", letterSpacing: 1, fontWeight: 700 }}>
                    <span>{selDate.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }).toUpperCase()}</span>
                    <button onClick={() => setSelectedMonthDay(null)} style={{ background: "none", border: "none", color: "#8b8b9e", cursor: "pointer", fontSize: 14 }}>{"✕"}</button>
                  </div>
                  <div style={{ display: "flex", gap: 6, justifyContent: "center" }}>
                    {[["done","#4cd137","✓"],["skip","#e84118","✗"],["neutral","#636e72","—"]].map(([val,col,sym]) => (
                      <button key={val} onClick={() => pickStatus(val, selectedMonthDay)}
                        style={{ width: 52, height: 44, borderRadius: 10, border: selStatus === val ? "3px solid #fff" : "2px solid transparent", background: col, color: "#fff", fontSize: 18, fontWeight: 900, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center" }}>{sym}</button>
                    ))}
                    <button onClick={() => pickStatus(undefined, selectedMonthDay)}
                      style={{ width: 52, height: 44, borderRadius: 10, border: !selStatus ? "3px solid #fff" : "2px solid #2d2d3a", background: "#2d2d3a", color: "#8b8b9e", fontSize: 18, fontWeight: 900, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center" }}>{"×"}</button>
                  </div>
                  {selNote && <div style={{ fontSize: 12, color: "#f0f0f4", lineHeight: 1.5, whiteSpace: "pre-wrap", marginTop: 10, paddingTop: 10, borderTop: "1px solid #2d2d3a" }}>{"📝"} {selNote}</div>}
                </div>
              );
            })()}
            <div style={{ display: "flex", justifyContent: "center", gap: 16, marginTop: 10, fontSize: 10, color: "#8b8b9e" }}>
              <span>{"✅"} {doneCount}/{totalDays}</span>
              <span>{"❌"} {skipCount}/{totalDays}</span>
              <span>{totalDays > 0 ? Math.round(doneCount/totalDays*100) : 0}% done</span>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

            <section className={`notes-editor${noteExpanded ? " notes-editor-expanded" : ""}`} data-note-editor aria-label="Page editor" tabIndex={0} onPaste={pasteNoteImages}>

                  <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "10px 14px", flexShrink: 0, borderBottom: "1px solid #2d2d3a", background: "#151526", flexWrap: "wrap" }}>
                    <button onClick={() => insertNoteText("• ")} title="Insert bullet" style={S.noteToolBtn}>• List</button>
                    <button onClick={() => insertNoteText("☐ ")} title="Insert checklist item" style={S.noteToolBtn}>☐ Task</button>
                    <button onClick={() => insertNoteText("──────────")} title="Insert divider" style={S.noteToolBtn}>— Divider</button>
                    <div ref={setNoteToolsHost} data-note-tools-host style={{ display: "flex", alignItems: "center", flexWrap: "wrap", minWidth: 0 }} />

                    <button type="button" aria-pressed={noteExpanded} aria-label={noteExpanded ? "Exit full window" : "Full window"} title={noteExpanded ? "Exit full window (Escape)" : "Expand note to fill the window"} onClick={() => setNoteExpanded(value => !value)} style={{ ...S.noteToolBtn, color: "#ddd3ff", borderColor: "#7c3aed88" }}>{noteExpanded ? "↙ Exit full window" : "↗ Full window"}</button>

                  {linkedTaskContext && (

                      <div style={{ flex: 1, minWidth: 170 }}>

                        <div style={{ color: linkedTaskContext.task.done ? "#77778a" : "#f0f0f4", fontSize: 11, fontWeight: 800, textDecoration: linkedTaskContext.task.done ? "line-through" : "none" }}>{linkedTaskContext.task.name}</div>
                      </div>
                      {!linkedTaskContext.task.done && <TaskWorkTimer task={linkedTaskContext.task} onToggle={() => toggleTaskTimer(linkedTaskContext.list.id, linkedTaskContext.task.id)} />}
                      <button onClick={() => { setPage("tasks"); openEditTask(linkedTaskContext.list.id, linkedTaskContext.task); }} style={{ ...S.noteToolBtn, color: "#c4b5fd", borderColor: "#7c3aed77" }}>OPEN TASK</button>

                  <div style={{ flex: 1, padding: "28px clamp(18px,4vw,48px) 20px", display: "flex", flexDirection: "column", minHeight: 0, overflowY: "auto" }}>
                    <input aria-label="Note title" value={noteDraft.title} onChange={(e) => setNoteDraft((draft) => ({ ...draft, title: e.target.value }))} placeholder="Page title" autoFocus style={{ width: "100%", background: "transparent", border: "none", borderBottom: "1px solid #3a3a4e", color: "#f7f7fb", fontSize: "clamp(22px,3vw,32px)", fontWeight: 800, fontFamily: "inherit", padding: "5px 0 13px", outline: "none" }} />
                    <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "10px 0 18px", flexWrap: "wrap" }}>
                      <span style={{ color: "#666677", fontSize: 10.5 }}>{new Date(noteDraft.updatedAt || noteDraft.createdAt || Date.now()).toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" })}</span>
                      <span style={{ color: "#3d3d50" }}>·</span>
                      <label style={{ display: "flex", alignItems: "center", gap: 6, color: "#77778a", fontSize: 10.5 }}>SECTION

                      onBodyChange={body => setNoteDraft(draft => ({ ...draft, body }))} onFinish={finishNoteEditing} beforeRemoveTextBox={async () => { await flushCurrentNote(); return protectBeforeDestructive("before-text-box-delete"); }}
                      onTextBoxesChange={textBoxes => {
                        const current = noteDraftRef.current;
                        if (!current || current.id !== noteDraft.id) return false;
                        const next = { ...current, textBoxes }, note = normalizedNoteDraft(next), source = dataRef.current;
                        if (accountBytesWithNote(source, note) > MAX_SAFE_DOC_BYTES) return false;
                        rememberNoteRemovals(current, next);
                        noteDraftRef.current = next; setNoteDraft(next); return true;
                      }}
                      onDrawingChange={drawing => {
                        const current = noteDraftRef.current;
                        if (!current || current.id !== noteDraft.id) return false;
                        const next = { ...current, drawing };
                        const note = normalizedNoteDraft(next);
                        const source = dataRef.current;
                        if (accountBytesWithNote(source, note) > MAX_SAFE_DOC_BYTES) return false;

                    <button onClick={() => toggleNotePin(noteDraft.id)} style={{ ...S.noteToolBtn, color: noteDraft.pinned ? "#ffd43b" : "#8b8b9e", borderColor: noteDraft.pinned ? "#ffd43b55" : "#353548" }}>{noteDraft.pinned ? "★ STARRED" : "☆ STAR"}</button>
                    {notes.some((note) => note.id === noteDraft.id) && <button onClick={() => deleteNote(noteDraft)} style={{ ...S.noteToolBtn, color: "#ff6b7a", borderColor: "#ff475744" }}>DELETE</button>}
                    <button onClick={finishNoteEditing} style={{ ...S.okBtn, flex: "none", padding: "8px 14px", fontSize: 10.5 }}>CLOSE</button>
                  </div>
                </>

                  <div><div style={{ width: 56, height: 62, margin: "0 auto 18px", borderRadius: "7px 13px 13px 7px", background: "linear-gradient(145deg,#292944,#1f1f35)", boxShadow: "inset 6px 0 #7c3aed55", display: "flex", alignItems: "center", justifyContent: "center", color: "#a78bfa", fontSize: 24, fontWeight: 900 }}>N</div><div style={{ color: "#c9c9d4", fontSize: 12, fontWeight: 900, letterSpacing: 1.2 }}>SELECT A PAGE</div><div style={{ color: "#666677", fontSize: 10, lineHeight: 1.7, marginTop: 8, maxWidth: 300 }}>Choose a page from the list or create a new one to start writing.</div><button onClick={() => openNewNote()} style={{ ...S.okBtn, display: "inline-block", flex: "none", marginTop: 16, padding: "10px 16px" }}>+ NEW PAGE</button></div>
                </div>
              )}
            </section>
          </div>
        )}

        {deleteSectionTarget && <div style={{ position: "fixed", inset: 0, background: "#000b", zIndex: 250, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div role="dialog" aria-modal="true" aria-labelledby="delete-section-heading" style={{ width: "100%", maxWidth: 420, background: "#171726", border: "1px solid #39394b", borderRadius: 14, padding: 22 }}>

            <p style={{ fontSize: 12, color: "#b5b5c9", lineHeight: 1.7, marginBottom: 18 }}>Keep its pages in Quick Notes, or delete the section and its pages. A recovery copy will be saved first.</p>
            {deleteSectionError && <p role="alert" style={{ color: "#fca5a5", fontSize: 12, marginBottom: 12 }}>{deleteSectionError}</p>}
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <button disabled={deleteSectionBusy} onClick={() => deleteNoteSection(false)} style={{ ...S.cBtn, padding: 12 }}>{deleteSectionBusy ? "Saving recovery copy…" : "Delete section, keep pages"}</button>
              <button disabled={deleteSectionBusy} onClick={() => deleteNoteSection(true)} style={{ ...S.dBtn, padding: 12 }}>Delete section and pages</button>
              <button autoFocus disabled={deleteSectionBusy} onClick={() => setDeleteSectionTarget(null)} style={{ ...S.cBtn, padding: 12 }}>Cancel</button>
            </div>
          </div>
        </div>}

        {page === "timer" && (() => {
          const fmtSec = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
          const pomoProg = pomoIsBreak ? 1 - (pomoSeconds / (pomoBreak * 60)) : 1 - (pomoSeconds / (pomoWork * 60));
          return (
            <div>
              <div style={{ background: "#1a1a2e", border: "1px solid #2d2d3a", borderRadius: 14, padding: "28px 20px", marginBottom: 16, textAlign: "center" }}>
                <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: 1.6, color: pomoIsBreak ? "#00ff87" : "#7c3aed", marginBottom: 12, textTransform: "uppercase" }}>
                  {pomoIsBreak ? "\u2615 BREAK" : "\uD83C\uDF45 POMODORO"}
                </div>
                <div style={{ marginBottom: 16 }}>
                  <input value={pomoTask} onChange={(e) => setPomoTask(e.target.value)}
                    placeholder="What are you working on?"
                    style={{ width: "100%", background: "#12122a", border: "1px solid #2d2d3a", borderRadius: 10, color: "#f0f0f4", fontSize: 13, fontFamily: "inherit", padding: "10px 14px", outline: "none", boxSizing: "border-box", textAlign: "center" }} />
                  {pomoTask && <div style={{ fontSize: 10, color: "#f0f0f4", marginTop: 6, fontWeight: 700, letterSpacing: 1 }}>WORKING ON: {pomoTask}</div>}
                </div>
                <div style={{ position: "relative", width: 180, height: 180, margin: "0 auto 20px" }}>
                  <svg width="180" height="180" style={{ transform: "rotate(-90deg)" }}>
                    <circle cx="90" cy="90" r="80" fill="none" stroke="#2d2d3a" strokeWidth="6" />
                    <circle cx="90" cy="90" r="80" fill="none" stroke={pomoIsBreak ? "#00ff87" : "#7c3aed"} strokeWidth="6"
                      strokeDasharray={2 * Math.PI * 80} strokeDashoffset={2 * Math.PI * 80 * (1 - pomoProg)} strokeLinecap="round" style={{ transition: "stroke-dashoffset 1s linear" }} />
                  </svg>
                  <div style={{ position: "absolute", top: 0, left: 0, right: 0, bottom: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
                    <span className="display" style={{ fontSize: 40, color: "#f4f4f8", fontVariantNumeric: "tabular-nums" }}>{fmtSec(pomoSeconds)}</span>
                    <span style={{ fontSize: 10, color: "#8b8b9e", marginTop: 4 }}>Session #{pomoSessions + 1}</span>
                  </div>
                </div>
                {pomoAlarmRinging && (
                  <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: 1.5, color: "#ff4757", marginBottom: 10, textAlign: "center" }}>
                    {"\uD83D\uDD14"} RINGING {"\u2014"} TAP START OR RESET TO STOP
                  </div>
                )}
                <div style={{ display: "flex", justifyContent: "center", gap: 12, marginBottom: 16 }}>
                  <button onClick={() => { stopPomoAlarm(); setPomoRunning(!pomoRunning); }} style={{ ...S.okBtn, flex: "none", padding: "12px 28px", fontSize: 13, borderRadius: 24, boxShadow: pomoAlarmRinging ? "0 0 0 4px #ff475766" : "none" }}>
                    {pomoAlarmRinging ? "\u25B6 Start" : (pomoRunning ? "\u23F8 Pause" : "\u25B6 Start")}
                  </button>
                  <button onClick={() => { stopPomoAlarm(); setPomoRunning(false); setPomoIsBreak(false); setPomoSeconds(pomoWork * 60); }} style={{ ...S.cBtn, flex: "none", padding: "12px 20px", borderRadius: 24 }}>
                    {"\u21BA"} Reset
                  </button>
                </div>
                <div style={{ display: "flex", gap: 12, justifyContent: "center" }}>
                  <div style={{ textAlign: "center" }}>
                    <label style={{ fontSize: 10, color: "#8b8b9e", letterSpacing: 1.2, fontWeight: 700 }}>WORK</label>
                    <input type="number" value={pomoWorkInput}
                      onChange={(e) => setPomoWorkInput(e.target.value)}
                      onBlur={() => { const v = Math.max(1, parseInt(pomoWorkInput) || 25); setPomWork(v); setPomoWorkInput(String(v)); if (!pomoRunning && !pomoIsBreak) setPomoSeconds(v * 60); }}
                      onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
                      style={{ ...S.inp, width: 60, textAlign: "center", padding: "6px", fontSize: 13, marginTop: 4 }} />
                  </div>
                  <div style={{ textAlign: "center" }}>
                    <label style={{ fontSize: 10, color: "#8b8b9e", letterSpacing: 1.2, fontWeight: 700 }}>BREAK</label>
                    <input type="number" value={pomoBreakInput}
                      onChange={(e) => setPomoBreakInput(e.target.value)}
                      onBlur={() => { const v = Math.max(1, parseInt(pomoBreakInput) || 5); setPomBreak(v); setPomoBreakInput(String(v)); if (!pomoRunning && pomoIsBreak) setPomoSeconds(v * 60); }}
                      onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
                      style={{ ...S.inp, width: 60, textAlign: "center", padding: "6px", fontSize: 13, marginTop: 4 }} />
                  </div>
                </div>
                <div style={{ fontSize: 10, color: "#8b8b9e", marginTop: 12 }}>Sessions completed: {pomoSessions}</div>
              </div>

              <div style={{ background: "#1a1a2e", border: "1px solid #2d2d3a", borderRadius: 14, padding: "24px 20px", marginBottom: 16, textAlign: "center" }}>
                <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: 1.6, color: "#ffd43b", marginBottom: 16 }}>{"\u23F1"} COUNTDOWN TIMER</div>
                <div className="display" style={{ fontSize: 36, color: customTimerSec > 0 ? "#ffd43b" : "#f4f4f8", marginBottom: 16, fontVariantNumeric: "tabular-nums" }}>{fmtSec(customTimerSec)}</div>
                {!customTimerRunning && customTimerSec === 0 && (
                  <div style={{ display: "flex", gap: 8, justifyContent: "center", marginBottom: 12 }}>

                    <button onClick={() => { const s = Math.max(1, parseInt(customTimerMin) || 5) * 60; setCustomTimerSec(s); }} style={{ ...S.okBtn, flex: "none", padding: "8px 16px", background: "linear-gradient(135deg, #ffd43b, #ff922b)", color: "#f8f8fa" }}>Set</button>

                <div style={{ display: "flex", justifyContent: "center", gap: 10 }}>
                  <button onClick={() => setCustomTimerRunning(!customTimerRunning)} disabled={customTimerSec === 0}
                    style={{ ...S.okBtn, flex: "none", padding: "10px 24px", borderRadius: 20, opacity: customTimerSec === 0 ? 0.3 : 1, background: "linear-gradient(135deg, #ffd43b, #ff922b)", color: "#f8f8fa" }}>

                  </button>
                  <button onClick={() => { setCustomTimerRunning(false); setCustomTimerSec(0); }} style={{ ...S.cBtn, flex: "none", padding: "10px 16px", borderRadius: 20 }}>{"\u21BA"}</button>
                </div>
              </div>

              <div style={{ background: "#1a1a2e", border: "1px solid #2d2d3a", borderRadius: 14, padding: "24px 20px", textAlign: "center" }}>
                <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: 1.6, color: "#00ff87", marginBottom: 16 }}>{"\u23F1"} STOPWATCH</div>
                <div style={{ fontSize: 36, fontWeight: 900, color: stopwatchRunning ? "#00ff87" : "#f0f0f4", marginBottom: 16, fontFamily: "inherit" }}>
                  {`${String(Math.floor(stopwatchSec / 3600)).padStart(2, "0")}:${String(Math.floor((stopwatchSec % 3600) / 60)).padStart(2, "0")}:${String(stopwatchSec % 60).padStart(2, "0")}`}
                </div>
                <div style={{ display: "flex", justifyContent: "center", gap: 10 }}>
                  <button onClick={() => setStopwatchRunning(!stopwatchRunning)} style={{ ...S.okBtn, flex: "none", padding: "10px 24px", borderRadius: 20, background: "linear-gradient(135deg, #00ff87, #00d9ff)", color: "#f8f8fa" }}>
                    {stopwatchRunning ? "\u23F8 Pause" : "\u25B6 Start"}
                  </button>
                  <button onClick={() => { setStopwatchRunning(false); setStopwatchSec(0); }} style={{ ...S.cBtn, flex: "none", padding: "10px 16px", borderRadius: 20 }}>{"\u21BA"}</button>
                </div>
              </div>
            </div>
          );
        })()}

        {page === "calendar" && (() => {
          if (calLoadError) return (
            <div style={{ maxWidth: 440, margin: "80px auto", textAlign: "center", background: "#12122a", border: "1px solid #ff475755", borderRadius: 14, padding: 24 }}>
              <div style={{ color: "#f0f0f4", fontSize: 13, fontWeight: 900, letterSpacing: 1.2, marginBottom: 10 }}>CALENDAR DATA KEPT SAFE</div>
              <div style={{ color: "#8b8b9e", fontSize: 10, lineHeight: 1.6, marginBottom: 18 }}>The calendar could not be loaded, so editing is paused to prevent an empty calendar from replacing your saved events.</div>
              <button onClick={() => { setCalLoadError(false); setCalEventsLoaded(false); setCalLoadAttempt((n) => n + 1); }} style={{ ...S.okBtn, width: "100%" }}>Retry Loading</button>
            </div>
          );
          // Until the saved calendar arrives the grid would look empty and take a new event that then
          // cannot be saved. Nothing is editable until it loads.
          if (!calEventsLoaded) return (
            <div role="status" style={{ maxWidth: 440, margin: "80px auto", textAlign: "center", color: "#8b8b9e", fontSize: 12, fontWeight: 700, letterSpacing: 1.2 }}>LOADING YOUR CALENDAR…</div>
          );
          const calDates = getCalWeekDates(calWeekOffset);
          const configuredStartHour = data.calStartHour ?? 6;
          const configuredEndHour = data.calEndHour ?? 23;
          const calEndHour = Math.min(47, Math.max(
            calendarLastHour(calDates.flatMap(d => getEventsForDate(localDateStr(d))), configuredEndHour),
            calCreating ? Math.ceil(calCreating.endMin / 60) - 1 : configuredEndHour,

          const calStartHour = calendarGridStartHour(calDates.map(d => getEventsForDate(localDateStr(d))), configuredStartHour, calEndHour);
          const spillCutoffMin = calendarSpillCutoffMin(calStartHour, calEndHour);

          function timeToMin(t) { const [h, m] = t.split(":").map(Number); return h * 60 + m; }
          function fmtHour(h) { const hr = ((h % 24) + 24) % 24; if (hr === 0) return "12 AM"; if (hr < 12) return hr + " AM"; if (hr === 12) return "12 PM"; return (hr - 12) + " PM"; }
          function shiftDateStr(ds, deltaDays) { const d = new Date(ds + "T12:00"); d.setDate(d.getDate() + deltaDays); return localDateStr(d); }
          // Returns events that should display in this column. Each item gets _displayMinFromStart (px-y math input).

            const spill = getEventsForDate(nextDs)

                  onMouseLeave={() => {

                        if (sMin >= 24 * 60) { sMin -= 24 * 60; eMin -= 24 * 60; targetDate = shiftDateStr(targetDate, 1); }
                        const startStr = `${String(Math.floor(sMin/60)).padStart(2,"0")}:${String(sMin%60).padStart(2,"0")}`;
                        const endStr = `${String(Math.floor(eMin/60)).padStart(2,"0")}:${String(eMin%60).padStart(2,"0")}`;

                        setCalEventEnd(endStr);

                      return;
                    }
                    if (calDragging && calDragging.moved) {

                      if (calDragging.newStart) { updates.start = calDragging.newStart; updates.end = calDragging.newEnd; }

                  onTouchMove={(e) => {

                    const rect = calGridRef.current.getBoundingClientRect();
                    const y = touch.clientY - rect.top;

                    const totalMin = Math.round((y / HOUR_H) * 60) + startMinBase;
                    const snapped = Math.round(totalMin / 15) * 15;
                    const colW = (rect.width - 40) / 7;
                    const dayIdx = Math.max(0, Math.min(6, Math.floor((x - 40) / colW)));
                    if (calCreating) {
                      setCalCreating({ ...calCreating, endMin: Math.max(calCreating.startMin + 15, snapped) });
                      return;
                    }
                    if (!calDragging) return;
                    const duration = calendarEndMinutes(calDragging.origStart, calDragging.origEnd) - timeToMin(calDragging.origStart);

                    let baseDate = calDates[dayIdx];
                    if (sm >= 24 * 60) { sm -= 24 * 60; em -= 24 * 60; const nd = new Date(baseDate); nd.setDate(nd.getDate() + 1); baseDate = nd; }
                    const newStart = `${String(Math.floor(sm/60)).padStart(2,"0")}:${String(sm%60).padStart(2,"0")}`;
                    const newEnd = `${String(Math.floor(em/60)).padStart(2,"0")}:${String(em%60).padStart(2,"0")}`;
                    const newDate = localDateStr(baseDate);
                    setCalDragging({ ...calDragging, newStart, newEnd, newDate, moved: true });
                  }}
                  onTouchEnd={() => {
                    if (calCreating) {
                      const dur = calCreating.endMin - calCreating.startMin;
                      if (dur >= 15) {
                        let sMin = calCreating.startMin, eMin = calCreating.endMin, targetDate = calCreating.date;
                        if (sMin >= 24 * 60) { sMin -= 24 * 60; eMin -= 24 * 60; targetDate = shiftDateStr(targetDate, 1); }
                        const startStr = `${String(Math.floor(sMin/60)).padStart(2,"0")}:${String(sMin%60).padStart(2,"0")}`;
                        const endStr = `${String(Math.floor(eMin/60)).padStart(2,"0")}:${String(eMin%60).padStart(2,"0")}`;
                        setCalAddEvent(targetDate);
                        setCalEventStart(startStr);
                        setCalEventEnd(endStr);
                        setCalEventTitle(""); setCalEventRepeat("none"); setCalEventDesc("");
                      }
                      setCalCreating(null);
                      return;
                    }
                    if (calDragging && calDragging.moved) {
                      const updates = {};
                      if (calDragging.newStart) { updates.start = calDragging.newStart; updates.end = calDragging.newEnd; }
                      if (calDragging.newDate) updates.date = calDragging.newDate;
                      editCalEvent(calDragging.id, updates);
                    }
                    setCalDragging(null);
                  }}
                >
                  {/* Hour labels + grid lines */}
                  {hours.map((h, hi) => (
                    <React.Fragment key={h}>
                      <div style={{ gridColumn: "1", gridRow: hi + 1, fontSize: 10.5, color: "#555566", textAlign: "right", paddingRight: 6, paddingTop: 2, height: HOUR_H, borderTop: "1px solid #2d2d3a22" }}>{fmtHour(h)}</div>
                      {calDates.map((d, di) => (
                        <div key={di} style={{ gridColumn: di + 2, gridRow: hi + 1, borderTop: "1px solid #2d2d3a44", borderLeft: "1px solid #2d2d3a22", height: HOUR_H, cursor: "crosshair", position: "relative" }}
                          onMouseDown={(e) => {
                            if (calDragging) return;
                            e.preventDefault();
                            const rect = calGridRef.current.getBoundingClientRect();
                            const y = e.clientY - rect.top;

                      ))}

                  ))}

                  {/* Drag-to-create preview */}
                  {calCreating && (() => {
                    const topPx = ((calCreating.startMin - startMinBase) / 60) * HOUR_H;
                    const heightPx = Math.max(((calCreating.endMin - calCreating.startMin) / 60) * HOUR_H, 15);
                    const fmtT = m => calendarTimeLabel(calendarStoredTime(m));
                    return (
                      <div style={{
                        position: "absolute", left: `calc(40px + ${calCreating.di} * ((100% - 40px) / 7) + 1px)`, width: `calc((100% - 40px) / 7 - 3px)`,
                        top: topPx, height: heightPx, background: "#7c3aed88", border: "2px solid #7c3aed", borderRadius: 4, padding: "2px 6px",
                        fontSize: 10, color: "#fff", fontWeight: 700, zIndex: 25, pointerEvents: "none",
                      }}>
                        <div>(New event)</div>
                        <div style={{ fontSize: 10.5, opacity: 0.8 }}>{fmtT(calCreating.startMin)} - {fmtT(calCreating.endMin)}</div>
                      </div>

                  })()}

                  {calDates.map((d, di) => {
                    const ds = localDateStr(d);
                    const dayEvents = getDisplayedEvents(ds);
                    // Overlapping events split the column side by side. The event being dragged is left out
                    // (it floats full-width on top) so the rest do not reshuffle under the pointer.
                    const minVisibleMin = 20 / HOUR_H * 60; // blocks are at least 20px tall, so short ones overlap visually
                    const overlap = layoutDayEvents(dayEvents
                      .filter(evt => !(calDragging && calDragging.id === (evt._origId || evt.id)))
                      .map(evt => {
                        const shift = evt._spilloverFromDate ? 24 * 60 : 0;
                        const start = timeToMin(evt.start) + shift;
                        return { key: evt.id, start, end: Math.max(calendarEndMinutes(evt.start, evt.end) + shift, start + minVisibleMin) };
                      }));
                    return dayEvents.map(evt => {
                      const isDraggingThis = calDragging && calDragging.id === (evt._origId || evt.id);
                      if (isDraggingThis && calDragging.newDate && calDragging.newDate !== ds) return null; // hide from original column
