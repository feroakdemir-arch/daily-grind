                      const displayEnd = isDraggingThis && calDragging.newEnd ? calDragging.newEnd : evt.end;
                      const startMin = timeToMin(displayStart);
                      const endMin = calendarEndMinutes(displayStart, displayEnd);
                      const spillShift = evt._spilloverFromDate ? 24 * 60 : 0;
                      const topPx = ((startMin + spillShift - startMinBase) / 60) * HOUR_H;
                      const heightPx = Math.max(((endMin - startMin) / 60) * HOUR_H, 20);
                      const fmtTime = calendarTimeLabel;
                      const isRepeating = evt._repeating || evt.repeat;
                      // If dragging to a different day, render at that column
                      let displayDi = di;
                      if (isDraggingThis && calDragging.newDate) {
                        const idx = calDates.findIndex(cd => localDateStr(cd) === calDragging.newDate);
                        if (idx >= 0) displayDi = idx;
                      }
                      const { col, cols } = overlap.get(evt.id) || { col: 0, cols: 1 };

                          top: topPx, height: heightPx, background: evt.color || "#4fc3f7", borderRadius: 4, padding: cols > 1 ? "2px 3px" : "2px 4px", overflow: "hidden",

                          boxShadow: isDraggingThis ? "0 4px 12px #00000088" : "0 1px 3px #00000044", lineHeight: 1.2,
                          borderLeft: isRepeating ? "3px solid #ffffff88" : "none", opacity: isDraggingThis ? 0.85 : 1,
                          transition: isDraggingThis ? "none" : "top 0.15s, height 0.15s", userSelect: "none",
                        }}
                          onClick={(e) => { e.stopPropagation();
                            if (calDragging && calDragging.moved) return; // don't open popup after drag
                            const origId = evt._origId || evt.id;
                            const origEvt = calEvents.find(ev => ev.id === origId) || evt;
                            setCalSelectedEvent({ ...origEvt, _displayDate: evt._spilloverFromDate || ds });

                        >

                          <div style={cols > 1 && heightPx > 36
                            ? { overflow: "hidden", display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", wordBreak: "break-word" }
                            : { whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{isRepeating && cols === 1 ? "\u21BB " : ""}{evt.title}</div>
                          {heightPx > 24 && <div style={{ fontSize: Math.max(9.5, eventFont - 1.5), opacity: 0.8, fontWeight: 600, whiteSpace: cols > 1 ? "nowrap" : undefined, overflow: "hidden", textOverflow: "ellipsis" }}>{cols > 1 ? fmtTime(displayStart) : <>{fmtTime(displayStart)} - {fmtTime(displayEnd)}</>}</div>}
                        </div>
                      );
                    });
                  })}

                  {/* Current time indicator */}
                  {(() => {
                    const position = calendarNowPosition(new Date(calendarNow), calDates, calStartHour, calEndHour);
                    if (!position) return null;
                    const nowDay = position.dayIndex;
                    const topPx = position.offset / 60 * HOUR_H;
                    return (
                      <div data-calendar-now aria-label="Current time" style={{ position: "absolute", left: `calc(40px + ${nowDay} * ((100% - 40px) / 7))`, width: `calc((100% - 40px) / 7)`, top: topPx, height: 2, background: "#e84118", zIndex: 20, pointerEvents: "none" }}>
                        <div style={{ position: "absolute", left: -4, top: -4, width: 10, height: 10, borderRadius: "50%", background: "#e84118" }} />
                      </div>
                    );
                  })()}
                </div>
              </div>

              {/* Event detail popup */}
              {calSelectedEvent && !calEditMode && (() => {
                const evt = calSelectedEvent;
                const fmtTime = calendarTimeLabel;
                const dateObj = new Date(evt._displayDate + "T12:00");
                const dayShort = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
                const repeatLabel = evt.repeat === "weekly" ? "Weekly" : evt.repeat === "daily" ? "Daily" : evt.repeat === "weekdays" ? "Weekdays" : evt.repeat === "custom" && Array.isArray(evt.repeatDays) && evt.repeatDays.length ? evt.repeatDays.slice().sort((a,b) => a-b).map(d => dayShort[d]).join(", ") : null;
                return (
                  <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "#000000aa", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}
                    onClick={() => { setCalSelectedEvent(null); setCalDeleteConfirm(false); }}>
                    <div style={{ background: "#1a1a2e", border: "1px solid #2d2d3a", borderRadius: 14, maxWidth: 360, width: "100%", overflow: "hidden", boxShadow: "0 12px 40px #000000aa" }}
                      onClick={(e) => e.stopPropagation()}>
                      {/* Color bar top */}
                      <div style={{ height: 6, background: evt.color || "#4fc3f7" }} />
                      {/* Action bar */}
                      <div style={{ display: "flex", justifyContent: "flex-end", gap: 4, padding: "10px 14px 0" }}>
                        <button onClick={() => { setCalEditMode(true); setCalEventTitle(evt.title); setCalEventStart(evt.start); setCalEventEnd(evt.end); setCalEventColor(evt.color || "#4fc3f7"); setCalEventRepeat(evt.repeat || "none"); setCalEventRepeatDays(Array.isArray(evt.repeatDays) ? evt.repeatDays : []); setCalEventDesc(evt.desc || ""); }}
                          style={{ background: "none", border: "none", cursor: "pointer", fontSize: 18, color: "#8b8b9e", padding: "4px 8px" }}>{"\u270E"}</button>
                        <button onClick={() => {
                          if (evt.repeat || evt._repeating) { setCalDeleteConfirm(true); }
                          else if (confirm(`Delete "${evt.title || "this event"}"? A safety copy will be kept first.`)) {
                            setCalSelectedEvent(null); setCalDeleteConfirm(false);
                            deleteCalEvent(evt.id);
                          }
                        }} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 18, color: "#8b8b9e", padding: "4px 8px" }}>{"\uD83D\uDDD1"}</button>
                        <button onClick={() => { setCalSelectedEvent(null); setCalDeleteConfirm(false); }}
                          style={{ background: "none", border: "none", cursor: "pointer", fontSize: 18, color: "#8b8b9e", padding: "4px 8px" }}>{"\u2715"}</button>
                      </div>
                      {/* Content */}
                      <div style={{ padding: "4px 20px 20px" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                          <div style={{ width: 14, height: 14, borderRadius: 4, background: evt.color || "#4fc3f7", flexShrink: 0 }} />
                          <h3 style={{ fontSize: 20, fontWeight: 700, color: "#f0f0f4", margin: 0 }}>{evt.title}</h3>
                        </div>
                        <div style={{ fontSize: 13, color: "#8b8b9e", marginBottom: 4 }}>
                          {dateObj.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })} {"\u00B7"} {fmtTime(evt.start)} - {fmtTime(evt.end)}
                        </div>
                        {repeatLabel && <div style={{ fontSize: 12, color: "#7c3aed", marginBottom: 8 }}>{"\u21BB"} {repeatLabel}</div>}
                        {evt.desc && (
                          <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid #2d2d3a" }}>
                            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                              <span style={{ fontSize: 14 }}>{"\u2630"}</span>
                              <span style={{ fontSize: 12, color: "#8b8b9e" }}>Description</span>
                            </div>
                            <div style={{ fontSize: 13, color: "#c9c9d4", whiteSpace: "pre-wrap", lineHeight: 1.5 }}>{evt.desc}</div>
                          </div>
                        )}
                        {calDeleteConfirm && (
                          <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid #2d2d3a", display: "flex", flexDirection: "column", gap: 8 }}>
                            <div style={{ fontSize: 13, fontWeight: 700, color: "#ff4757", marginBottom: 2 }}>Delete recurring event</div>
                            <button onClick={() => { const realId = evt._origId || evt.id; setCalSelectedEvent(null); setCalDeleteConfirm(false); deleteCalEvent(realId, false, evt._displayDate); }}
                              style={{ padding: "10px 14px", borderRadius: 8, border: "1px solid #2d2d3a", background: "#12122a", cursor: "pointer", fontSize: 13, color: "#e2e2ea", textAlign: "left" }}>
                              {"\uD83D\uDDD1"} This event
                            </button>
                            <button onClick={() => { const realId = evt._origId || evt.id; setCalSelectedEvent(null); setCalDeleteConfirm(false); deleteCalEvent(realId, false, undefined, evt._displayDate); }}
                              style={{ padding: "10px 14px", borderRadius: 8, border: "1px solid #fbbf2440", background: "#fbbf2414", cursor: "pointer", fontSize: 13, color: "#fbbf24", textAlign: "left" }}>
                              {"\uD83D\uDDD1"} This and following events
                            </button>
                            <button onClick={() => { const realId = evt._origId || evt.id; setCalSelectedEvent(null); setCalDeleteConfirm(false); deleteCalEvent(realId, true); }}
                              style={{ padding: "10px 14px", borderRadius: 8, border: "1px solid #ff475740", background: "#ff475714", cursor: "pointer", fontSize: 13, color: "#ff4757", textAlign: "left" }}>
                              {"\uD83D\uDDD1"} All events
                            </button>
                            <button onClick={() => setCalDeleteConfirm(false)}
                              style={{ padding: "8px 14px", borderRadius: 8, border: "none", background: "none", cursor: "pointer", fontSize: 12, color: "#8b8b9e", textAlign: "center" }}>
                              Cancel
                            </button>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })()}

              {/* Edit event modal */}
              {calSelectedEvent && calEditMode && (
                <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "#000000aa", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}
                  onClick={() => { setCalSelectedEvent(null); setCalEditMode(false); }}>
                  <div style={{ background: "#1a1a2e", border: "1px solid #2d2d3a", borderRadius: 14, padding: 20, maxWidth: 340, width: "100%" }}
                    onClick={(e) => e.stopPropagation()}>
                    <h3 style={{ fontSize: 13, fontWeight: 800, color: "#f0f0f4", letterSpacing: 1.2, marginBottom: 16 }}>EDIT EVENT</h3>
                    <label style={{ fontSize: 10.5, color: "#8b8b9e", letterSpacing: 1.2, fontWeight: 700, display: "block", marginBottom: 4 }}>TITLE</label>
                    <input style={S.inp} value={calEventTitle} onChange={(e) => setCalEventTitle(e.target.value)} autoFocus />
                    <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
                      <div style={{ flex: 1 }}><label style={{ fontSize: 10.5, color: "#8b8b9e", letterSpacing: 1.2, fontWeight: 700, display: "block", marginBottom: 4 }}>START</label>
                        <input aria-label="Event start time" type="time" style={S.inp} value={calEventStart} onChange={(e) => setCalEventStart(e.target.value)} /></div>
                      <div style={{ flex: 1 }}><label style={{ fontSize: 10.5, color: "#8b8b9e", letterSpacing: 1.2, fontWeight: 700, display: "block", marginBottom: 4 }}>END</label>
                        <input aria-label="Event end time" type="time" style={S.inp} value={calendarClockTime(calEventEnd)} onChange={(e) => setCalEventEnd(e.target.value)} />{calendarEndMinutes(calEventStart, calEventEnd) >= 1440 && <div style={{ color: "#c4b5fd", fontSize: 10, marginTop: 6 }}>Ends the next day</div>}</div>
                    </div>
                    <label style={{ fontSize: 10.5, color: "#8b8b9e", letterSpacing: 1.2, fontWeight: 700, display: "block", marginBottom: 4, marginTop: 8 }}>DESCRIPTION</label>
                    <textarea style={{ ...S.inp, minHeight: 60, resize: "vertical" }} value={calEventDesc} onChange={(e) => setCalEventDesc(e.target.value)} placeholder="Add details..." />
                    <label style={{ fontSize: 10.5, color: "#8b8b9e", letterSpacing: 1.2, fontWeight: 700, display: "block", marginBottom: 4, marginTop: 8 }}>REPEAT</label>
                    <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
                      {[["none","None"],["daily","Daily"],["weekdays","Weekdays"],["weekly","Weekly"],["custom","Custom"]].map(([v,l]) => (
                        <button key={v} onClick={() => setCalEventRepeat(v)} style={{ flex: 1, padding: "8px 4px", borderRadius: 8, fontSize: 10, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1, border: calEventRepeat === v ? "2px solid #7c3aed" : "1px solid #2d2d3a", background: calEventRepeat === v ? "#7c3aed22" : "#12122a", color: calEventRepeat === v ? "#c4b5fd" : "#8b8b9e" }}>{l}</button>
                      ))}
                    </div>
                    {calEventRepeat === "custom" && (
                      <div style={{ display: "flex", gap: 4, marginBottom: 12 }}>
                        {["S","M","T","W","T","F","S"].map((l, idx) => {
                          const on = calEventRepeatDays.includes(idx);
                          return (
                            <button key={idx} onClick={() => setCalEventRepeatDays(on ? calEventRepeatDays.filter(d => d !== idx) : [...calEventRepeatDays, idx])}
                              style={{ flex: 1, padding: "8px 0", borderRadius: 8, fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", border: on ? "2px solid #7c3aed" : "1px solid #2d2d3a", background: on ? "#7c3aed22" : "#12122a", color: on ? "#c4b5fd" : "#8b8b9e" }}>{l}</button>
                          );
                        })}
                      </div>
                    )}
                    <label style={{ fontSize: 10.5, color: "#8b8b9e", letterSpacing: 1.2, fontWeight: 700, display: "block", marginBottom: 4 }}>COLOR</label>
                    <CalColorPicker value={calEventColor} onChange={setCalEventColor} />
                    {calEventFormProblem && <div role="alert" style={{ color: "#ff6b81", fontSize: 11, fontWeight: 700, marginBottom: 10 }}>{calEventFormProblem}</div>}
                    <div style={{ display: "flex", gap: 10 }}>
                      <button onClick={() => { setCalEditMode(false); }} style={S.cBtn}>Cancel</button>
                      <button disabled={!!calEventFormProblem} onClick={() => {
                        if (calEventFormProblem) return;
                        const isCustom = calEventRepeat === "custom" && calEventRepeatDays.length > 0;
                        // Turning a series into a one-off keeps it on the day being edited. It used to fall back to
                        // the series' first date (out of view, or invisible if that day had been deleted).
                        const becomesOneOff = !!calSelectedEvent.repeat && calEventRepeat === "none";
                        editCalEvent(calSelectedEvent.id, { title: calEventTitle.trim(), start: calEventStart, end: calEventEnd, color: calEventColor, repeat: calEventRepeat === "none" ? undefined : calEventRepeat, repeatDays: isCustom ? [...calEventRepeatDays].sort((a,b) => a-b) : undefined, desc: calEventDesc.trim() || undefined,
                          ...(becomesOneOff && calSelectedEvent._displayDate ? { date: calSelectedEvent._displayDate, exceptions: undefined, untilDate: undefined } : {}) });
                        setCalSelectedEvent(null); setCalEditMode(false);
                      }} style={{ ...S.okBtn, opacity: calEventFormProblem ? 0.5 : 1 }}>Save</button>
                    </div>
                  </div>
                </div>
              )}

              {/* Add event modal */}
              {calAddEvent && (
                <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "#000000aa", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}
                  onClick={() => setCalAddEvent(null)}>
                  <div style={{ background: "#1a1a2e", border: "1px solid #2d2d3a", borderRadius: 14, padding: 20, maxWidth: 340, width: "100%" }}
                    onClick={(e) => e.stopPropagation()}>
                    <h3 style={{ fontSize: 13, fontWeight: 800, color: "#f0f0f4", letterSpacing: 1.2, marginBottom: 16 }}>ADD EVENT - {new Date(calAddEvent + "T12:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })}</h3>
                    <label style={{ fontSize: 10.5, color: "#8b8b9e", letterSpacing: 1.2, fontWeight: 700, display: "block", marginBottom: 4 }}>TITLE</label>
                    <input style={S.inp} value={calEventTitle} onChange={(e) => setCalEventTitle(e.target.value)} placeholder="Event name" autoFocus />
                    <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
                      <div style={{ flex: 1 }}><label style={{ fontSize: 10.5, color: "#8b8b9e", letterSpacing: 1.2, fontWeight: 700, display: "block", marginBottom: 4 }}>START</label>
                        <input aria-label="Event start time" type="time" style={S.inp} value={calEventStart} onChange={(e) => setCalEventStart(e.target.value)} /></div>
                      <div style={{ flex: 1 }}><label style={{ fontSize: 10.5, color: "#8b8b9e", letterSpacing: 1.2, fontWeight: 700, display: "block", marginBottom: 4 }}>END</label>
                        <input aria-label="Event end time" type="time" style={S.inp} value={calendarClockTime(calEventEnd)} onChange={(e) => setCalEventEnd(e.target.value)} />{calendarEndMinutes(calEventStart, calEventEnd) >= 1440 && <div style={{ color: "#c4b5fd", fontSize: 10, marginTop: 6 }}>Ends the next day</div>}</div>
                    </div>
                    <label style={{ fontSize: 10.5, color: "#8b8b9e", letterSpacing: 1.2, fontWeight: 700, display: "block", marginBottom: 4, marginTop: 8 }}>DESCRIPTION</label>
                    <textarea style={{ ...S.inp, minHeight: 60, resize: "vertical" }} value={calEventDesc} onChange={(e) => setCalEventDesc(e.target.value)} placeholder="Add details..." />
                    <label style={{ fontSize: 10.5, color: "#8b8b9e", letterSpacing: 1.2, fontWeight: 700, display: "block", marginBottom: 4, marginTop: 8 }}>REPEAT</label>
                    <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
                      {[["none","None"],["daily","Daily"],["weekdays","Weekdays"],["weekly","Weekly"],["custom","Custom"]].map(([v,l]) => (
                        <button key={v} onClick={() => setCalEventRepeat(v)} style={{ flex: 1, padding: "8px 4px", borderRadius: 8, fontSize: 10, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1, border: calEventRepeat === v ? "2px solid #7c3aed" : "1px solid #2d2d3a", background: calEventRepeat === v ? "#7c3aed22" : "#12122a", color: calEventRepeat === v ? "#c4b5fd" : "#8b8b9e" }}>{l}</button>
                      ))}
                    </div>
                    {calEventRepeat === "custom" && (
                      <div style={{ display: "flex", gap: 4, marginBottom: 12 }}>
                        {["S","M","T","W","T","F","S"].map((l, idx) => {
                          const on = calEventRepeatDays.includes(idx);
                          return (
                            <button key={idx} onClick={() => setCalEventRepeatDays(on ? calEventRepeatDays.filter(d => d !== idx) : [...calEventRepeatDays, idx])}
                              style={{ flex: 1, padding: "8px 0", borderRadius: 8, fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", border: on ? "2px solid #7c3aed" : "1px solid #2d2d3a", background: on ? "#7c3aed22" : "#12122a", color: on ? "#c4b5fd" : "#8b8b9e" }}>{l}</button>
                          );
                        })}
                      </div>
                    )}
                    <label style={{ fontSize: 10.5, color: "#8b8b9e", letterSpacing: 1.2, fontWeight: 700, display: "block", marginBottom: 4 }}>COLOR</label>
                    <CalColorPicker value={calEventColor} onChange={setCalEventColor} />
                    {calEventFormProblem && <div role="alert" style={{ color: "#ff6b81", fontSize: 11, fontWeight: 700, marginBottom: 10 }}>{calEventFormProblem}</div>}
                    <div style={{ display: "flex", gap: 10 }}>
                      <button onClick={() => setCalAddEvent(null)} style={S.cBtn}>Cancel</button>
                      <button disabled={!!calEventFormProblem} onClick={() => {
                        if (calEventTitle.trim() && !calEventFormProblem) {
                          addCalEvent(calAddEvent, calEventTitle.trim(), calEventStart, calEventEnd, calEventColor, calEventRepeat, calEventDesc.trim(), calEventRepeatDays);
                          setCalAddEvent(null); setCalEventRepeat("none"); setCalEventRepeatDays([]); setCalEventDesc("");
                        }
                      }} style={{ ...S.okBtn, opacity: calEventFormProblem ? 0.5 : 1 }}>Add Event</button>
                    </div>
                  </div>
                </div>
              )}

              {/* Calendar settings modal */}
              {showCalSettings && (
                <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "#000000aa", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}
                  onClick={() => setShowCalSettings(false)}>
                  <div role="dialog" aria-label="Calendar settings" style={{ background: "#1a1a2e", border: "1px solid #2d2d3a", borderRadius: 14, padding: 20, maxWidth: 420, width: "100%", maxHeight: "85dvh", overflowY: "auto" }}
                    onClick={(e) => e.stopPropagation()}>
                    <h3 style={{ fontSize: 13, fontWeight: 800, color: "#f0f0f4", letterSpacing: 1.2, marginBottom: 6 }}>CALENDAR SETTINGS</h3>
                    <CalendarReminders />
                    <div style={{ fontSize: 10, color: "#8b8b9e", marginBottom: 16, lineHeight: 1.5 }}>Adjust when your day starts and how late it runs. Hours past midnight will appear at the bottom of the same day's column — so 1 AM stays inside your day.</div>
                    <label style={{ fontSize: 10.5, color: "#8b8b9e", letterSpacing: 1.2, fontWeight: 700, display: "block", marginBottom: 4 }}>DAY STARTS AT</label>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 14 }}>
                      {[4,5,6,7,8,9,10].map(h => (
                        <button key={h} onClick={() => save((current) => ({ ...current, calStartHour: h }))}
                          style={{ padding: "8px 12px", borderRadius: 8, border: configuredStartHour === h ? "2px solid #7c3aed" : "1px solid #2d2d3a", background: configuredStartHour === h ? "#7c3aed22" : "#12122a", color: configuredStartHour === h ? "#c4b5fd" : "#8b8b9e", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
                          {fmtHour(h)}
                        </button>
                      ))}
                    </div>
                    <label style={{ fontSize: 10.5, color: "#8b8b9e", letterSpacing: 1.2, fontWeight: 700, display: "block", marginBottom: 4 }}>DAY ENDS AT</label>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 14 }}>
                      {[21,22,23,24,25,26,27,28].map(h => (
                        <button key={h} onClick={() => save((current) => ({ ...current, calEndHour: h }))}
                          style={{ padding: "8px 12px", borderRadius: 8, border: configuredEndHour === h ? "2px solid #7c3aed" : "1px solid #2d2d3a", background: configuredEndHour === h ? "#7c3aed22" : "#12122a", color: configuredEndHour === h ? "#c4b5fd" : "#8b8b9e", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
                          {fmtHour(h)}{h >= 24 ? " +1" : ""}
                        </button>
                      ))}
                    </div>
                    <div style={{ fontSize: 10, color: "#7c3aed", marginBottom: 16, lineHeight: 1.4 }}>Currently showing {fmtHour(calStartHour)} → {fmtHour(calEndHour)}{calEndHour >= 24 ? " (next morning)" : ""} · {totalHours}h</div>
                    <div style={{ display: "flex", gap: 10 }}>
                      <button onClick={() => save((current) => ({ ...current, calStartHour: 6, calEndHour: 23 }))} style={S.cBtn}>Reset Default</button>
                      <button onClick={() => setShowCalSettings(false)} style={S.okBtn}>Done</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })()}

        {page !== "notes" && page !== "calendar" && <div style={{ height: 80 }} />}
      </div>
      <Nav />
    </div>
  );

  const FW = (children) => <div style={S.shell}><div style={S.box}>{children}</div><Nav /></div>;

  if (view === "addHabit") {
    const sec = data.habitSections.find((s) => s.id === editSection);
    return FW(<div style={S.fCard}><h2 style={S.fTitle}>ADD TO {sec?.title}</h2>
      <label style={S.lbl}>Name</label><input style={S.inp} value={formName} onChange={(e) => setFormName(e.target.value)} autoFocus />
      <label style={S.lbl}>Points</label><input style={S.inp} type="number" value={formPoints} onChange={(e) => setFormPoints(e.target.value)} min="1" />
      <label style={S.lbl}>Description (optional)</label><textarea style={S.textarea} value={formDesc} onChange={(e) => setFormDesc(e.target.value)} placeholder="e.g., Mon-Push, Tue-Rest, Wed-Pull..." rows={3} />
      <div style={S.fAct}><button onClick={() => { setView("main"); setFormDesc(""); }} style={S.cBtn}>Cancel</button><button onClick={() => addHabit(editSection)} style={S.okBtn}>Add</button></div>
    </div>);
  }

  if (view === "editHabit" && editItem) {
    return FW(<div style={S.fCard}><h2 style={S.fTitle}>EDIT HABIT</h2>
      <label style={S.lbl}>Name</label><input style={S.inp} value={formName} onChange={(e) => setFormName(e.target.value)} autoFocus />
      <label style={S.lbl}>Points</label><input style={S.inp} type="number" value={formPoints} onChange={(e) => setFormPoints(e.target.value)} min="1" />
      <label style={S.lbl}>Description</label><textarea style={S.textarea} value={formDesc} onChange={(e) => setFormDesc(e.target.value)} placeholder="Add details, schedule, notes..." rows={4} />
      <label style={S.lbl}>{"\uD83D\uDCDD"} Today's Comment</label><textarea style={{ ...S.textarea, borderColor: "#7c3aed44" }} value={formComment} onChange={(e) => setFormComment(e.target.value)} placeholder="e.g., 82.5kg, skipped because sick, did 30 min instead..." rows={2} />
      <label style={S.lbl}>Move to section</label>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 4 }}>
        {orderedHabitSections(data.habitSections).map((sec) => <button key={sec.id} onClick={() => moveHabitTo(sec.id)} style={{ padding: "7px 12px", background: editSection === sec.id ? "#7c3aed33" : "#12122a", border: `1px solid ${editSection === sec.id ? "#7c3aed" : "#2d2d3a"}`, borderRadius: 8, color: editSection === sec.id ? "#7c3aed" : "#8b8b9e", fontSize: 10, cursor: "pointer", fontFamily: "inherit" }}>{sec.icon} {sec.title}</button>)}
      </div>
      <div style={S.fAct}>
        <button onClick={() => deleteHabit(editItem.id)} style={S.dBtn}>Delete</button>
        <button onClick={() => { setView("main"); setEditItem(null); }} style={S.cBtn}>Cancel</button>
        <button onClick={saveHabitEdit} style={S.okBtn}>Save</button>
      </div>
    </div>);
  }

  if (view === "editTask" && editTaskCtx) {
    const editingTask = data.taskLists.find((list) => list.id === editTaskCtx.listId)?.items.find((task) => task.id === editTaskCtx.itemId);
    const hasLinkedTaskNote = !!(editingTask?.noteId && notes.some((note) => note.id === editingTask.noteId));
    const setQuick = (days) => {
      const d = new Date(); d.setDate(d.getDate() + days);
      const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      setFormTaskDeadline(iso);
    };
    return FW(<div style={S.fCard}><h2 style={S.fTitle}>EDIT TASK</h2>
      <label style={S.lbl}>Name</label><input style={S.inp} value={formTaskName} onChange={(e) => setFormTaskName(e.target.value)} autoFocus />
      <label style={S.lbl}>Points</label><input style={S.inp} type="number" value={formTaskPoints} onChange={(e) => setFormTaskPoints(e.target.value)} min="0" />
      <label style={S.lbl}>Deadline</label>
      <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
        <button onClick={() => setQuick(0)} style={{ flex: 1, padding: "8px 4px", borderRadius: 8, fontSize: 10, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1, border: "1px solid #2d2d3a", background: "#12122a", color: "#8b8b9e" }}>Today</button>
        <button onClick={() => setQuick(1)} style={{ flex: 1, padding: "8px 4px", borderRadius: 8, fontSize: 10, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1, border: "1px solid #2d2d3a", background: "#12122a", color: "#8b8b9e" }}>Tmrw</button>
        <button onClick={() => setQuick(3)} style={{ flex: 1, padding: "8px 4px", borderRadius: 8, fontSize: 10, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1, border: "1px solid #2d2d3a", background: "#12122a", color: "#8b8b9e" }}>3d</button>
        <button onClick={() => setQuick(7)} style={{ flex: 1, padding: "8px 4px", borderRadius: 8, fontSize: 10, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1, border: "1px solid #2d2d3a", background: "#12122a", color: "#8b8b9e" }}>1wk</button>
        <button onClick={() => { setFormTaskDeadline(""); setFormTaskTime(""); }} style={{ flex: 1, padding: "8px 4px", borderRadius: 8, fontSize: 10, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1, border: "1px solid #2d2d3a", background: "#12122a", color: "#ff4757" }}>Clear</button>
      </div>
      <div style={{ display: "flex", gap: 10 }}>
        <div style={{ flex: 1 }}><label style={{ ...S.lbl, marginTop: 0 }}>Date</label>
          <input type="date" style={S.inp} value={formTaskDeadline} onChange={(e) => setFormTaskDeadline(e.target.value)} /></div>
        <div style={{ flex: 1 }}><label style={{ ...S.lbl, marginTop: 0 }}>Time (optional)</label>
          <input type="time" style={S.inp} value={formTaskTime} onChange={(e) => setFormTaskTime(e.target.value)} disabled={!formTaskDeadline} /></div>
      </div>
      <label style={S.lbl}>Move to list</label>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 4 }}>
        {data.taskLists.map((l) => {
          const isCurrent = editTaskCtx.listId === l.id;
          return (
            <button key={l.id} onClick={() => moveTaskTo(l.id)}
              style={{ padding: "7px 12px", background: isCurrent ? "#7c3aed33" : "#12122a", border: `1px solid ${isCurrent ? "#7c3aed" : "#2d2d3a"}`, borderRadius: 8, color: isCurrent ? "#7c3aed" : "#8b8b9e", fontSize: 10, cursor: "pointer", fontFamily: "inherit", fontWeight: 700, letterSpacing: 1 }}>
              {l.title}{l.resetsDaily && <span style={{ marginLeft: 4, fontSize: 10 }}>{"↻"}</span>}
            </button>
          );
        })}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(220px,1fr))", gap: 10, marginTop: 18 }}>
        <button onClick={() => { setPomoTask(formTaskName.trim() || "Task"); setEditTaskCtx(null); setView("main"); setPage("timer"); }}
          style={{ width: "100%", padding: "12px", background: "#7c3aed22", border: "1px solid #7c3aed", borderRadius: 10, color: "#c4b5fd", fontSize: 11, fontWeight: 800, letterSpacing: 1.2, cursor: "pointer", fontFamily: "inherit" }}>
          {"↑ SEND TO POMODORO"}
        </button>
        <button onClick={sendTaskToNotes} disabled={taskNoteSending}
          style={{ width: "100%", padding: "12px", background: "#00d9ff14", border: "1px solid #00d9ff88", borderRadius: 10, color: "#67e8f9", fontSize: 11, fontWeight: 800, letterSpacing: 1.2, cursor: taskNoteSending ? "wait" : "pointer", fontFamily: "inherit", opacity: taskNoteSending ? 0.65 : 1 }}>
          {taskNoteSending ? "OPENING NOTES..." : hasLinkedTaskNote ? "↗ OPEN TASK NOTE" : "↗ SEND TO NOTES"}
        </button>
      </div>
      <div style={S.fAct}>
        <button onClick={async () => { if (await deleteTaskItem(editTaskCtx.listId, editTaskCtx.itemId)) { setEditTaskCtx(null); setView("main"); } }} style={S.dBtn}>Delete</button>
        <button onClick={() => { setEditTaskCtx(null); setView("main"); }} style={S.cBtn}>Cancel</button>
        <button onClick={saveTaskEdit} style={S.okBtn}>Save</button>
      </div>
    </div>);
  }

  if (view === "store") {
    const items = data.storeItems || mkStoreDefaults(data.dailyGoal);
    const purchases = (data.storePurchases || []).slice(0, 5);
    return FW(<div style={S.fCard}>
      {storeBuyAnim && (
        <div className="overlay-pop" style={{ ...S.win, background: "radial-gradient(circle at center,#00d9ff26 0%,#0b0b14f2 62%)", pointerEvents: "none" }}>
          <div style={{ fontSize: 48, marginBottom: 12 }}>{"🛒"}</div>
          <div style={{ ...S.winTxt, color: "#00d9ff", textShadow: "0 0 40px #00d9ff66" }}>{storeBuyAnim.toUpperCase()}</div>
          <div style={S.winSub}>You earned it. Enjoy it guilt-free.</div>
        </div>
      )}
      <h2 style={S.fTitle}>{"🛒"} STORE</h2>
      <div style={{ fontSize: 10, color: "#8b8b9e", letterSpacing: 1, marginBottom: 18, lineHeight: 1.6 }}>You don't take cheat days. You earn them. Spending never touches your XP or level.</div>
      <div style={{ background: "#12122a", border: "1px solid #2d2d3a", borderRadius: 12, padding: "16px", marginBottom: 20, textAlign: "center" }}>
        <div style={{ fontSize: 34, fontWeight: 900, color: "#00d9ff", lineHeight: 1 }}>{walletBalance.toLocaleString()}</div>
        <div style={{ fontSize: 10.5, color: "#8b8b9e", letterSpacing: 1.5, fontWeight: 700, marginTop: 6 }}>SPENDABLE POINTS</div>
        <div style={{ fontSize: 10.5, color: "#555566", marginTop: 4 }}>{walletEarned.toLocaleString()} earned lifetime {"·"} {(data.walletSpent || 0).toLocaleString()} spent</div>
      </div>
      {items.map((item) => {
        const affordable = walletBalance >= item.price;
        if (editStoreId === item.id) {
          return (
            <div key={item.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "12px 0", borderBottom: "1px solid #2d2d3a" }}>
              <input style={{ ...S.inp, flex: 2, padding: "9px 11px" }} value={editStoreName} onChange={(e) => setEditStoreName(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") saveStoreEdit(); }} autoFocus />
              <input style={{ ...S.inp, flex: 1, padding: "9px 11px" }} type="number" value={editStorePrice} onChange={(e) => setEditStorePrice(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") saveStoreEdit(); }} />
              <button onClick={saveStoreEdit} style={{ padding: "9px 14px", borderRadius: 9, border: "none", background: "#4cd137", color: "#fff", fontSize: 13, fontWeight: 900, cursor: "pointer", fontFamily: "inherit" }}>{"✓"}</button>
              <button onClick={() => setEditStoreId(null)} style={{ padding: "9px 12px", borderRadius: 9, border: "1px solid #2d2d3a", background: "none", color: "#8b8b9e", fontSize: 13, fontWeight: 900, cursor: "pointer", fontFamily: "inherit" }}>{"✕"}</button>
            </div>
          );
        }
        return (
          <div key={item.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 0", borderBottom: "1px solid #2d2d3a" }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#f0f0f4" }}>{item.name}</div>
              <div style={{ fontSize: 10, color: affordable ? "#00d9ff" : "#555566", fontWeight: 700, marginTop: 2 }}>{item.price.toLocaleString()} pts</div>
            </div>
            <button onClick={() => startStoreEdit(item)} title="Edit reward" style={{ background: "none", border: "none", cursor: "pointer", fontSize: 13, color: "#8b8b9e", padding: "2px 6px", fontFamily: "inherit" }}>{"✎"}</button>
            <button onClick={() => buyStoreItem(item, walletBalance)} disabled={!affordable}
              style={{ padding: "9px 18px", borderRadius: 9, border: "none", background: affordable ? "linear-gradient(135deg,#00d9ff,#0abde3)" : "#2d2d3a", color: affordable ? "#0b0b14" : "#555566", fontSize: 11, fontWeight: 900, letterSpacing: 1, cursor: affordable ? "pointer" : "default", fontFamily: "inherit" }}>
              {affordable ? "BUY" : "LOCKED"}
            </button>
            <button onClick={() => { if (confirm(`Remove "${item.name}" from the store?`)) deleteStoreItem(item.id); }} style={S.tX}>&times;</button>
          </div>
        );
      })}
      <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
        <input style={{ ...S.inp, flex: 2 }} placeholder="Add your own reward..." value={storeName} onChange={(e) => setStoreName(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") addStoreItem(); }} />
        <input style={{ ...S.inp, flex: 1 }} type="number" placeholder="pts" value={storePrice} onChange={(e) => setStorePrice(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") addStoreItem(); }} />
        <button onClick={addStoreItem} style={{ ...S.okBtn, flex: "none", padding: "11px 16px" }}>Add</button>
      </div>
      {purchases.length > 0 && (
        <div style={{ marginTop: 22, borderTop: "1px solid #2d2d3a", paddingTop: 14 }}>
          <div style={{ fontSize: 10.5, color: "#8b8b9e", letterSpacing: 1.5, fontWeight: 800, marginBottom: 8 }}>RECENT PURCHASES</div>
          {purchases.map((p) => (
            <div key={p.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", fontSize: 11, color: "#8b8b9e" }}>
              <span>{p.name}</span>
              <span style={{ color: "#555566" }}>-{p.price.toLocaleString()} {"·"} {fmtDoneDate(p.date)}</span>
            </div>
          ))}
        </div>
      )}
      <div style={S.fAct}>
        <button onClick={() => setView("main")} style={S.cBtn}>Back</button>
      </div>
    </div>);
  }

  if (view === "settings") {
    return FW(<div style={S.fCard}><h2 style={S.fTitle}>SETTINGS</h2>
      <label style={S.lbl}>Daily Point Goal</label><input style={S.inp} type="number" value={goalInput} onChange={(e) => setGoalInput(e.target.value)} min="1" />
      <div style={S.fAct}><button onClick={() => setView("main")} style={S.cBtn}>Cancel</button><button onClick={saveGoal} style={S.okBtn}>Save</button></div>
      <div style={{ marginTop: 28, borderTop: "1px solid #2d2d3a", paddingTop: 20 }}>
        <label style={S.lbl}>Day Resets At</label>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {[0,1,2,3,4,5,6].map(h => (
            <button key={h} onClick={() => save((current) => ({ ...current, dayResetHour: h }))}
              style={{ padding: "8px 14px", borderRadius: 8, border: (data.dayResetHour || 0) === h ? "2px solid #7c3aed" : "1px solid #2d2d3a",
                background: (data.dayResetHour || 0) === h ? "#7c3aed22" : "#12122a", color: (data.dayResetHour || 0) === h ? "#7c3aed" : "#8b8b9e",
                fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
              {h === 0 ? "Midnight" : `${h} AM`}
            </button>
          ))}
        </div>
        <div style={{ fontSize: 10, color: "#8b8b9e", marginTop: 6 }}>When the day flips over. Habits & daily tasks reset at this time.</div>
      </div>
      <div style={{ marginTop: 28, borderTop: "1px solid #2d2d3a", paddingTop: 20 }}>
        <label style={S.lbl}>Account</label>
        {window._user ? (
          <div>
            <div style={{ fontSize: 12, color: "#4cd137", marginBottom: 8 }}>Signed in as {window._user.email || window._user.displayName || "your account"}</div>
            <div style={{ fontSize: 10, color: "#8b8b9e", marginBottom: 12, lineHeight: 1.5 }}>Your data is saved to your account and syncs on every device you sign in on.</div>
            <div style={S.fAct}>
              <button onClick={() => { alert("Pulling latest from cloud..."); location.reload(); }} style={S.cBtn}>Pull from Cloud</button>
              <button onClick={async () => {
                try {
                  try { await flushCurrentNote(); } catch (error) { console.warn(error); }
                  // Signing out removes this device's copy, so first let pending changes reach the cloud.
                  const synced = await window.storage.flush(10000);
                  if (!synced && !confirm("Some changes haven't reached the cloud yet (you may be offline). Signing out now deletes them from this device.\n\nSign out anyway?")) return;
                  await window._signOut(); location.reload();
                } catch (error) { alert(error.message || "Sign-out could not finish. Please try again."); }
              }} style={S.dBtn}>Sign out</button>
            </div>
          </div>
        ) : (
          <div>
            <div style={{ fontSize: 10, color: "#8b8b9e", marginBottom: 12, lineHeight: 1.5 }}>Sign in to save your data to a personal account that syncs on all your devices. (Replaces sync codes.)</div>
            <button onClick={async () => {
              try {
                await window._signInWithGoogle();
                location.reload();
              } catch (e) {
                const code = e && e.code;
                if (code === "auth/operation-not-allowed") alert("Google sign-in isn't switched on yet.\n\nFirebase console: Authentication, Sign-in method, enable Google.");
                else if (code === "auth/unauthorized-domain") alert("This domain isn't authorized yet.\n\nFirebase console: Authentication, Settings, Authorized domains, add feroakdemir-arch.github.io");
                else if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") { /* user changed their mind */ }
                else alert("Sign-in failed: " + ((e && e.message) || e));
              }
            }} style={{ ...S.okBtn, background: "#fff", color: "#1a1a2e", display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>
              <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.3l-6.3-5.4C29.3 34.9 26.8 36 24 36c-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4 5.6l6.3 5.4C41.4 35.4 44 30.1 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
              Continue with Google
            </button>
          </div>
        )}
      </div>
      <div style={{ marginTop: 28, borderTop: "1px solid #2d2d3a", paddingTop: 20 }}>
        <label style={S.lbl}>Data Protection</label>
        <div style={{ background: "#12122a", border: "1px solid #2d2d3a", borderRadius: 12, padding: 14, marginBottom: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 7 }}>
            <span style={{ color: window.dataVault?.cloudEnabled() ? "#4cd137" : "#fbbf24", fontSize: 12 }}>{"●"}</span>
            <span style={{ fontSize: 11, fontWeight: 800, color: "#f0f0f4", letterSpacing: 1 }}>
              {window.dataVault?.cloudEnabled() ? "AUTOMATIC CLOUD HISTORY ACTIVE" : "LOCAL SAVING ACTIVE"}
            </span>
          </div>
          <div style={{ fontSize: 10, color: "#8b8b9e", lineHeight: 1.6 }}>
            {window.dataVault?.cloudEnabled()
              ? "Organized Me keeps paired main-data and calendar recovery copies: latest, hourly, daily, and weekly. The app never automatically deletes them."
              : "Your device keeps the current copy. Sign in for long-term cloud history across devices."}
          </div>
          {vaultInfo.state === "saving" && <div style={{ marginTop: 8, fontSize: 10.5, color: "#00d9ff", letterSpacing: 1.5 }}>CREATING RECOVERY COPIES…</div>}
          {vaultInfo.state === "saved" && <div style={{ marginTop: 8, fontSize: 10.5, color: "#4cd137", letterSpacing: 1.5 }}>RECOVERY COPIES CURRENT • {new Date(vaultInfo.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</div>}
          {vaultInfo.state === "error" && <div style={{ marginTop: 8, fontSize: 10.5, color: "#ff6b7a", lineHeight: 1.5 }}>BACKUP NEEDS ATTENTION • {vaultInfo.error}</div>}
        </div>
        <div style={{ marginBottom: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10.5, color: "#aaaabb", marginBottom: 6, letterSpacing: 0.4 }}>
            <span>Account storage</span>
            <span className="num" style={{ color: accountFull >= 0.9 ? "#ff6b78" : accountFull >= 0.7 ? "#ffd43b" : "#aaaabb" }}>{Math.round(accountBytes / 1000)} KB of {Math.round(MAX_SAFE_DOC_BYTES / 1000)} KB · {Math.round(accountFull * 100)}%</span>
          </div>
          <div role="meter" aria-label="Account storage used" aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.round(accountFull * 100)} style={{ height: 6, borderRadius: 3, background: "#2d2d3a", overflow: "hidden" }}>
            <div style={{ width: `${Math.min(100, accountFull * 100)}%`, height: "100%", background: accountFull >= 0.9 ? "#ff6b78" : accountFull >= 0.7 ? "#ffd43b" : "#7c3aed" }} />
          </div>
          {accountFull >= 0.7 && <div style={{ fontSize: 10, color: "#8b8b9e", marginTop: 6, lineHeight: 1.5 }}>
            Pages with lots of handwriting take the most space. Download a full backup, then delete pages you no longer need. At 100% new changes can't be saved.
          </div>}
        </div>
        <div style={{ fontSize: 10, color: "#8b8b9e", marginBottom: 10, lineHeight: 1.55 }}>
          Downloaded backups are your independent copy if the entire site, account, or Firebase project is ever removed.
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={downloadFullBackup} style={{ ...S.okBtn, flex: "1 1 180px" }}>Download Full Backup</button>
          <button onClick={() => backupFileRef.current?.click()} style={{ ...S.cBtn, flex: "1 1 180px" }}>Restore Backup File</button>
          <input ref={backupFileRef} type="file" accept=".json,application/json" onChange={importBackupFile} style={{ display: "none" }} />
        </div>
        <div style={{ marginTop: 10, display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={loadCloudBackups} disabled={vaultLoading} style={{ ...S.cBtn, flex: "1 1 180px", opacity: vaultLoading ? 0.6 : 1 }}>
            {vaultLoading ? "Loading Recovery History…" : "View Recovery History"}
          </button>
          {vaultItems.length > 0 && <button onClick={restoreCloudBackup} disabled={vaultLoading || !vaultSelectedId} style={{ ...S.okBtn, flex: "1 1 180px", opacity: vaultLoading ? 0.6 : 1 }}>Restore Selected Copy</button>}
        </div>
        {vaultItems.length > 0 && (
          <select value={vaultSelectedId} onChange={(event) => setVaultSelectedId(event.target.value)} style={{ ...S.inp, marginTop: 10, fontSize: 10 }}>
            {vaultItems.map((item) => (
              <option key={item.id} value={item.id}>
                {`${item.kind.toUpperCase()} • ${item.at ? new Date(item.at).toLocaleString() : "time unavailable"}${item.reason && item.reason !== "automatic" ? ` • ${item.reason.replaceAll("-", " ")}` : ""}`}
              </option>
            ))}
          </select>
        )}
        {vaultMessage && <div style={{ marginTop: 9, fontSize: 10, color: vaultMessage.toLowerCase().includes("failed") || vaultMessage.toLowerCase().includes("could not") ? "#ff6b7a" : "#4cd137", lineHeight: 1.5 }}>{vaultMessage}</div>}
      </div>
      <div style={{ marginTop: 28, borderTop: "1px solid #2d2d3a", paddingTop: 20 }}>
        <button onClick={resetAll} style={{ width: "100%", padding: 11, background: "none", border: "1px solid #ff475733", borderRadius: 8, color: "#ff4757", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1.2, textTransform: "uppercase" }}>Reset Everything</button>
      </div>
    </div>);
  }
  return null;
}

const S = {
  shell: { minHeight: "100vh", background: "#0b0b14", color: "#e6e6ee", fontFamily: "'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif", fontSize: 14 },
  box: { padding: "16px 14px", maxWidth: 900, margin: "0 auto", paddingBottom: 80 },
  title: { fontSize: "clamp(15px, 4.4vw, 19px)", fontWeight: 800, fontStretch: "125%", letterSpacing: 1.5, margin: 0, color: "#f4f4f8", whiteSpace: "nowrap" },
  date: { fontSize: 12, color: "#9a9aae", letterSpacing: 0.3, marginTop: 5, fontWeight: 500 },
  streakB: { display: "flex", alignItems: "center", gap: 5, height: 40, fontSize: 15, fontWeight: 800, color: "#fbbf24", background: "linear-gradient(180deg, #fbbf241f, #fbbf2410)", border: "1px solid #fbbf2447", borderRadius: 12, padding: "0 12px", whiteSpace: "nowrap" },
  gear: { background: "#14142a", border: "1px solid #2d2d3a", color: "#a0a0b4", width: 40, height: 40, borderRadius: 12, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", padding: 0 },
  sc: { position: "relative", overflow: "hidden", background: "linear-gradient(160deg, #1d1b33 0%, #15152a 100%)", border: "1px solid #7c3aed33", borderRadius: 20, padding: "20px 18px", marginBottom: 24, boxShadow: "inset 0 1px 0 #ffffff0d, 0 8px 24px #00000066" },
  tr: { height: 6, background: "#2d2d3a", borderRadius: 3, overflow: "hidden" },
  fl: { height: "100%", borderRadius: 3, transition: "width 0.4s cubic-bezier(0.22,1,0.36,1)" },
