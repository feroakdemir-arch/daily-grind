}
function levelFromPoints(xp) {
  let level = 1, need = 100, cum = 0;
  while (xp >= cum + need && level < 99) { cum += need; level++; need = 50 * (level + 1); }
  return { level, intoLevel: Math.max(0, xp - cum), needed: need };
}
function rankForLevel(level) { let r = RANKS[0][1]; for (const [l, name] of RANKS) { if (level >= l) r = name; } return r; }
function lifetimePoints(data, todayScore) {
  return Object.values(data.history || {}).reduce((s, h) => s + dayXP(h.score || 0, h.goal), 0) + dayXP(todayScore, data.dailyGoal);
}

// Store: default rewards, priced off the user's daily goal so they're "costly"
// relative to how much a real day earns. Wallet = raw points earned minus spent;
// spending never touches XP or level — those are lifetime-permanent.
function mkStoreDefaults(goal) {
  const g = Math.max(50, goal || 100);
  const r10 = (x) => Math.max(10, Math.round(x / 10) * 10);
  return [
    { id: "st_sleepin", name: "Sleep In", price: r10(g * 0.75) },
    { id: "st_skipgym", name: "Skip the Gym", price: r10(g * 1) },
    { id: "st_friends", name: "Hang Out With Friends", price: r10(g * 1) },
    { id: "st_rest", name: "Rest Day", price: r10(g * 1.5) },
    { id: "st_cheat", name: "Cheat Day", price: r10(g * 2) },
  ];
}
function totalEarnedPoints(data, todayScore) {
  return Object.values(data.history || {}).reduce((s, h) => s + (h.score || 0), 0) + Math.max(0, todayScore);
}

function allHabits(secs) { return secs.flatMap((s) => s.items); }
function habitScore(tl, secs) { return allHabits(secs).reduce((sc, i) => sc + (tl[i.id] === "done" ? i.points : 0), 0); }
function taskScore(lists, today) { return lists.flatMap((l) => l.items).reduce((sc, t) => sc + ((t.done && (!t.doneDate || t.doneDate === today)) ? t.points : 0), 0); }
function getStreak(id, log, today) {
  if (log[today]?.[id] !== "done") return 0; let s = 1;
  const d = new Date(today + "T12:00:00");
  for (let i = 1; i < 365; i++) { const p = new Date(d); p.setDate(d.getDate() - i); if (log[localDateStr(p)]?.[id] === "done") s++; else break; }
  return s;
}
function getOverall(id, log) { const ds = Object.keys(log); if (!ds.length) return 0; return Math.round((ds.filter((d) => log[d]?.[id] === "done").length / ds.length) * 100); }
const statusCycle = [undefined, "done", "skip", "neutral"];

function deadlineChip(deadline) {
  if (!deadline) return null;
  const hasTime = deadline.includes("T");
  const due = new Date(deadline + (hasTime ? "" : "T23:59:59"));
  const now = new Date();
  const dayMs = 24 * 60 * 60 * 1000;
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const dueStart = new Date(due); dueStart.setHours(0,0,0,0);
  const diffDays = Math.round((dueStart - todayStart) / dayMs);
  const fmtTime = (d) => { const h = d.getHours(); const m = d.getMinutes(); const ampm = h >= 12 ? "p" : "a"; const hr = h > 12 ? h-12 : h || 12; return `${hr}${m ? ":"+String(m).padStart(2,"0") : ""}${ampm}`; };
  if (due < now) {
    const daysLate = Math.max(1, Math.ceil((now - due) / dayMs));
    return { text: `⚠ ${daysLate}d late`, color: "#ff4757", bg: "#ff475722", border: "#ff475755" };
  }
  if (diffDays === 0) {
    return { text: hasTime ? `📅 Today ${fmtTime(due)}` : "📅 Today", color: "#ffa502", bg: "#ffa50222", border: "#ffa50255" };
  }
  if (diffDays === 1) return { text: hasTime ? `📅 Tmrw ${fmtTime(due)}` : "📅 Tmrw", color: "#ffa502", bg: "#ffa50222", border: "#ffa50255" };
  if (diffDays < 7) return { text: `📅 ${due.toLocaleDateString("en-US", { weekday: "short" })}${hasTime ? " " + fmtTime(due) : ""}`, color: "#8b8b9e", bg: "#2d2d3a", border: "#3d3d4a" };
  return { text: `📅 ${due.getMonth()+1}/${due.getDate()}`, color: "#8b8b9e", bg: "#2d2d3a", border: "#3d3d4a" };
}

function fmtDoneDate(d) {
  if (!d) return "";
  try { return new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }); }
  catch (e) { return ""; }
}

function taskElapsedSeconds(task, now = Date.now()) {
  const saved = Math.max(0, Number(task.trackedSeconds) || 0);
  const startedAt = Number(task.timerStartedAt);
  if (!Number.isFinite(startedAt) || startedAt <= 0) return saved;
  return saved + Math.max(0, Math.floor((now - startedAt) / 1000));
}

function stopTaskTimer(task, now = Date.now()) {
  if (!task.timerStartedAt) return task;
  const stopped = { ...task, trackedSeconds: taskElapsedSeconds(task, now) };
  delete stopped.timerStartedAt;
  return stopped;
}

function fmtTaskDuration(seconds) {
  const total = Math.max(0, Math.floor(Number(seconds) || 0));
  const hours = Math.floor(total / 3600);
  const minutes = Math.floor((total % 3600) / 60);
  const secs = total % 60;
  return hours > 0
    ? `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`
    : `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
}

function TaskWorkTimer({ task, onToggle }) {
  const startedAt = Number(task.timerStartedAt);
  const running = Number.isFinite(startedAt) && startedAt > 0;
  const [now, setNow] = useState(Date.now());

  useEffect(() => {
    setNow(Date.now());
    if (!running) return;
    const interval = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(interval);
  }, [running, startedAt]);

  const elapsed = taskElapsedSeconds(task, now);
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 7, marginTop: 5, minHeight: 22 }}>
      <button
        onClick={onToggle}
        aria-label={`${running ? "Stop" : "Start"} timer for ${task.name}`}
        aria-pressed={running}
        title={running ? "Stop tracking time" : "Start tracking time"}
        style={{
          background: running ? "#ff47571c" : "#00ff8714",
          border: `1px solid ${running ? "#ff475766" : "#00ff874d"}`,
          borderRadius: 6,
          color: running ? "#ff6b78" : "#00ff87",
          cursor: "pointer",
          fontFamily: "inherit",
          fontSize: 9,
          fontWeight: 900,
          letterSpacing: 1,
          padding: "4px 7px",
          lineHeight: 1,
          flexShrink: 0,
        }}
      >
        {running ? "■ STOP" : "▶ START"}
      </button>
      <span style={{ color: running ? "#00ff87" : "#8b8b9e", fontSize: 10, fontWeight: 800, letterSpacing: 0.8, fontVariantNumeric: "tabular-nums" }}>
        {running && <span aria-hidden="true" style={{ display: "inline-block", width: 6, height: 6, borderRadius: "50%", background: "#00ff87", boxShadow: "0 0 8px #00ff87", marginRight: 6 }} />}
        {fmtTaskDuration(elapsed)}
      </span>
    </div>
  );
}

function SaveIndicator({ info, onRetry }) {
  if (!info || info.state === "idle") return null;
  const isError = info.state === "error";
  const color = isError ? "#ff6b78" : info.state === "saving" ? "#ffd43b" : "#00b86b";

      {label}
    </button>
  );
}

function TaskListCard({ list, listIdx, onToggle, onToggleTimer, onDelete, onDeleteList, onAdd, onSendToPomo, onReorder, onEdit, onReorderList, onDeleteCompleted }) {

  function handleListDragStart(e) {

    const applyMove = () => {
      const scrollDelta = window.scrollY - startScrollY;
      setListDragOffset(currentY - startY + scrollDelta);
      const compareY = currentY + window.scrollY;
      let closest = listIdx;
      let minDist = Infinity;
      listRects.current.forEach((r, i) => {
        const dist = Math.abs(compareY - r.mid);
        if (dist < minDist) { minDist = dist; closest = i; }
      });
      listDragRef.current.toIdx = closest;
    };
    const stopAutoScroll = startDragAutoScroll(() => currentY, applyMove);

    const onMove = (ev) => {
      currentY = ev.touches ? ev.touches[0].clientY : ev.clientY;
      applyMove();
    };
    const onEnd = () => {
      stopAutoScroll();
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onEnd);
      document.removeEventListener("touchmove", onMove);

  }

  const pending = list.items.filter((t) => !t.done);

  const completedLive = list.items.filter((t) => t.done).map((t) => ({ key: t.id, taskId: t.id, name: t.name, points: t.points, date: t.doneDate, trackedSeconds: taskElapsedSeconds(t), live: true }));
  const completedArchived = (list.completedLog || []).map((e) => ({ key: e.id, name: e.name, points: e.points, date: e.date, trackedSeconds: Math.max(0, Number(e.trackedSeconds) || 0), live: false }));
  const completedAll = [...completedLive, ...completedArchived].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const completedView = completedAll.slice(0, completedShown);

  function getPendingRealIndex(pendingIdx) {
    let count = 0;
    for (let i = 0; i < list.items.length; i++) {
      if (!list.items[i].done) { if (count === pendingIdx) return i; count++; }
    }
    return -1;
  }

  function handleDragStart(e, idx) {
    e.preventDefault();
    const startY = e.touches ? e.touches[0].clientY : e.clientY;

    let currentY = startY;

      const r = row.getBoundingClientRect();
      rects.push({ mid: r.top + r.height / 2 + window.scrollY });
    });
    rowRects.current = rects;
    dragRef.current = { fromIdx: idx, toIdx: idx, startY };
    setDragIdx(idx);
    setDropIdx(idx);
    setDragOffset(0);

    const applyMove = () => {
      const scrollDelta = window.scrollY - startScrollY;
      setDragOffset(currentY - startY + scrollDelta);
      const compareY = currentY + window.scrollY;
      let closest = idx;
      let minDist = Infinity;
      rowRects.current.forEach((r, i) => {
        const dist = Math.abs(compareY - r.mid);
        if (dist < minDist) { minDist = dist; closest = i; }
      });
      dragRef.current.toIdx = closest;
      setDropIdx(closest);
    };
    const stopAutoScroll = startDragAutoScroll(() => currentY, applyMove);

    const onMove = (ev) => {
      currentY = ev.touches ? ev.touches[0].clientY : ev.clientY;
      applyMove();
    };
    const onEnd = () => {
      stopAutoScroll();
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onEnd);
      document.removeEventListener("touchmove", onMove);
      document.removeEventListener("touchend", onEnd);
      const from = dragRef.current.fromIdx;
      const to = dragRef.current.toIdx;
      setDragIdx(null);
      setDropIdx(null);
      setDragOffset(0);
      dragRef.current = null;
      rowRects.current = [];
      if (from !== to) {
        onReorder(list.id, getPendingRealIndex(from), getPendingRealIndex(to));
      }
    };
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onEnd);
    document.addEventListener("touchmove", onMove, { passive: false });
    document.addEventListener("touchend", onEnd);
  }

  function handleAdd() {
    if (!text.trim()) return;

      transition: listDragging ? "none" : "transform 0.15s",
      boxShadow: listDragging ? "0 14px 32px rgba(124,58,237,0.45)" : (S.taskList.boxShadow || "none"),
      zIndex: listDragging ? 50 : "auto",
      position: "relative",
      opacity: listDragging ? 0.95 : 1,

      <div style={S.tlHead}>
        <span

          style={{ cursor: "grab", color: "#8b8b9e", fontSize: 22, padding: "0 10px 0 0", userSelect: "none", touchAction: "none", lineHeight: 1, fontWeight: 900, letterSpacing: -2 }}

        <span style={S.tlTitle}>{list.title}{list.resetsDaily && <span style={{ fontSize: 9, color: "#7c3aed", marginLeft: 6, fontWeight: 700 }}>{"\u21BB"} Daily</span>}</span>
        <button onClick={() => onDeleteList(list.id)} style={S.tlDel} title="Delete list">&times;</button>
      </div>

      {pending.map((t, i) => {
        const isMe = dragIdx === i;
        const isDragging = dragIdx !== null;
        return (
        <div key={t.id} data-taskrow={i} style={{
          ...S.tRow,
          borderTop: dropIdx === i && isDragging && dragIdx !== i && dragIdx > i ? "2px solid #7c3aed" : "none",
          borderBottom: dropIdx === i && isDragging && dragIdx !== i && dragIdx < i ? "2px solid #7c3aed" : "none",
          transform: isMe ? `translateY(${dragOffset}px) scale(1.02)` : "none",
          transition: isMe ? "none" : "transform 0.15s",
          boxShadow: isMe ? "0 10px 24px rgba(124,58,237,0.45)" : "none",
          background: isMe ? "#1a1a2e" : (S.tRow.background || "transparent"),
          zIndex: isMe ? 50 : "auto",
          position: "relative",
          opacity: isMe ? 0.95 : 1,
          pointerEvents: isDragging && !isMe ? "none" : "auto",
        }}>
          <span
            onPointerDown={(e) => handleDragStart(e, i)}
            onTouchStart={(e) => handleDragStart(e, i)}
            style={{ cursor: "grab", color: "#8b8b9e", fontSize: 18, padding: "0 6px 0 0", userSelect: "none", touchAction: "none", lineHeight: 1, fontWeight: 900 }}
            title="Drag to reorder"
          >{"\u22ee"}</span>
          <button onClick={() => onToggle(list.id, t.id)} style={S.tCircle} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
              <span style={{ ...S.tText, flex: "0 1 auto" }}>{t.name}</span>
              {(() => { const chip = deadlineChip(t.deadline); return chip && <span style={{ padding: "2px 8px", borderRadius: 10, fontSize: 9, fontWeight: 800, letterSpacing: 0.5, color: chip.color, background: chip.bg, border: `1px solid ${chip.border}`, whiteSpace: "nowrap" }}>{chip.text}</span>; })()}

          </div>
          {t.points > 0 && <span style={S.tPts}>+{t.points}</span>}
          <button onClick={() => onEdit && onEdit(list.id, t)} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 13, color: "#8b8b9e", padding: "2px 6px", fontFamily: "inherit" }} title="Edit task">{"\u270e"}</button>
          <button onClick={() => onDelete(list.id, t.id)} style={S.tX}>&times;</button>
        </div>
        );
      })}

      <div style={S.tAddRow}>
        <span style={S.tAddIcon}>+</span>
        <input ref={inputRef} style={S.tAddInp} placeholder="Add a task" value={text}

              {"\u21BB"} Load more ({completedAll.length - completedShown} more)

function HabitCard({ item, secId, idx, data, save, today, weekDates, tl, habitDrag, setHabitDrag, reorderHabit, openEditHabit }) {

        if (dist < minDist) { minDist = dist; closest = i; }
      });
      toIdx = closest;
      setHabitDrag({ secId, dragIdx: idx, dropIdx: closest, offset: currentY - startY + scrollDelta });
    };
    const stopAutoScroll = startDragAutoScroll(() => currentY, applyMove);

        const habits = allHabits(current.habitSections);

        const score = hsAfter + ts;
        nd.history = { ...current.history, [targetDate]: { ...entry, score, won: score >= (entry.goal || current.dailyGoal), ts } };
      }
      return nd;

        // grid ends at the current week and the editor sits right under it.
        while (cells.length > 7) {
          const lastWeek = cells.slice(-7);

              {cells.map((d, i) => {
                if (d === null) return <div key={"e"+i} />;
                const ds = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
                const st = data.log[ds]?.[item.id];
                const nt = data.log[ds]?.[item.id + "_note"];
                const isFuture = ds > today;
                const isToday = ds === today;
                let bg = "#2d2d3a", clr = "#666";
                if (st === "done") { bg = "#4cd137"; clr = "#fff"; }
                else if (st === "skip") { bg = "#e84118"; clr = "#fff"; }
                else if (st === "neutral") { bg = "#636e72"; clr = "#fff"; }
                else if (nt) { bg = "#4cd13744"; clr = "#4cd137"; }

                  <div key={d} onClick={() => { if (isFuture) return; setSelectedMonthDay(selectedMonthDay === ds ? null : ds); }}
                    style={{ width: "100%", aspectRatio: "1", borderRadius: "50%", background: isFuture ? "#1a1a2e" : bg, color: isFuture ? "#333" : clr, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: isToday ? 900 : 600, border: selectedMonthDay === ds ? "2px solid #ffd43b" : isToday ? "2px solid #c4b5fd" : nt && !isFuture ? "2px dotted #a78bfa55" : "2px solid transparent", opacity: isFuture ? 0.3 : 1, cursor: isFuture ? "default" : "pointer" }}>{d}</div>
                );
              })}
            </div>
            {selectedMonthDay && (() => {
              const selDate = new Date(selectedMonthDay + "T12:00");
              const selStatus = data.log[selectedMonthDay]?.[item.id];
              const selNote = data.log[selectedMonthDay]?.[item.id + "_note"];
              return (
                <div style={{ marginTop: 6, padding: "10px 12px", background: "#12122a", borderRadius: 8, border: "1px solid #2d2d3a", width: "100%" }}>
                  <div style={{ fontSize: 10, color: "#c4b5fd", marginBottom: 8, display: "flex", justifyContent: "space-between", alignItems: "center", letterSpacing: 1, fontWeight: 700 }}>
                    <span>{selDate.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }).toUpperCase()}</span>
                    <button onClick={() => setSelectedMonthDay(null)} style={{ background: "none", border: "none", color: "#8b8b9e", cursor: "pointer", fontSize: 14 }}>{"✕"}</button>
                  </div>
                  <div style={{ display: "flex", gap: 6, justifyContent: "center" }}>
                    {[["done","#4cd137","✓"],["skip","#e84118","✗"],["neutral","#636e72","—"]].map(([val,col,sym]) => (
                      <button key={val} onClick={() => pickStatus(val, selectedMonthDay)}
                        style={{ width: 52, height: 44, borderRadius: 10, border: selStatus === val ? "3px solid #fff" : "2px solid transparent", background: col, color: "#fff", fontSize: 18, fontWeight: 900, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center" }}>{sym}</button>
                    ))}
                    <button onClick={() => pickStatus(undefined, selectedMonthDay)}
                      style={{ width: 52, height: 44, borderRadius: 10, border: !selStatus ? "3px solid #fff" : "2px solid #2d2d3a", background: "#2d2d3a", color: "#8b8b9e", fontSize: 18, fontWeight: 900, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center" }}>{"×"}</button>
                  </div>
                  {selNote && <div style={{ fontSize: 12, color: "#f0f0f4", lineHeight: 1.5, whiteSpace: "pre-wrap", marginTop: 10, paddingTop: 10, borderTop: "1px solid #2d2d3a" }}>{"📝"} {selNote}</div>}
                </div>
              );
            })()}
            <div style={{ display: "flex", justifyContent: "center", gap: 16, marginTop: 10, fontSize: 10, color: "#8b8b9e" }}>
              <span>{"✅"} {doneCount}/{totalDays}</span>
              <span>{"❌"} {skipCount}/{totalDays}</span>
              <span>{totalDays > 0 ? Math.round(doneCount/totalDays*100) : 0}% done</span>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

  useEffect(() => { calEventsRef.current = calEvents; }, [calEvents]);
  useEffect(() => window.storage.onStatus ? window.storage.onStatus(setSaveInfo) : undefined, []);

  useEffect(() => { (async () => {
    setLoading(true);
    setLoadError("");
    let loaded = false;
    for (let attempt = 0; attempt < 4; attempt++) {
      try {
        const r = await window.storage.get(STORAGE_KEY);
        if (r && r.error) {
          // A signed-in account with no safe local cache must never fall back
          // to an empty starter; that could overwrite real cloud data.
          if (attempt < 3) { await new Promise((res) => setTimeout(res, 700 * (attempt + 1))); continue; }
          setLoadError("We couldn't safely load your saved data. Nothing has been overwritten.");
          break;
        }
        if (r?.value) {
          const parsed = parseMainData(r.value);
          dataRef.current = parsed;
          setData(parsed);
          setGoalInput(String(parsed.dailyGoal || 100));
          setHasSavedData(true);
        } else {
          const starter = mkDefault();
          dataRef.current = starter;
          setData(starter);
          setHasSavedData(false);
        }
        loaded = true;
        break;
      } catch (e) {
        console.warn("Main data load failed:", e);
        setLoadError("Your saved data couldn't be read safely. Nothing has been overwritten.");
        break;
      }
    }
    if (!loaded && !dataRef.current) setData(null);
    setLoading(false);
  })(); }, [loadAttempt]);

  const save = useCallback((nextOrUpdater) => {
    const current = dataRef.current;
    if (!current) return Promise.resolve(null);
    const next = typeof nextOrUpdater === "function" ? nextOrUpdater(current) : nextOrUpdater;
    if (!next || typeof next !== "object") return Promise.resolve(null);
    dataRef.current = next;
    setData(next);
    setHasSavedData(true);
    return window.storage.set(STORAGE_KEY, JSON.stringify(next)).catch((e) => { console.error(e); return null; });
  }, []);

  const retrySaves = useCallback(() => {
    const jobs = [];
    if (dataRef.current) jobs.push(window.storage.set(STORAGE_KEY, JSON.stringify(dataRef.current)));
    if (calEventsLoaded && !calLoadError) jobs.push(window.storage.set("dg-cal-events", JSON.stringify(calEventsRef.current)));
    Promise.allSettled(jobs);
  }, [calEventsLoaded, calLoadError]);

  // Real-time cloud sync subscription for main data
  useEffect(() => {
    if (!window.storage.subscribe) return;
    const unsub = window.storage.subscribe(STORAGE_KEY, (newValue) => {
      try {

        dataRef.current = parsed;
        setData(parsed);

        calEventsRef.current = parsed;

      }
      catch(e) { console.warn("Cal live sync parse failed:", e); }
    });
    return unsub;
  }, []);

  // Load calendar events from cloud sync (single source of truth)
  useEffect(() => {
    if (calEventsLoaded) return;
    (async () => {
      try {
        const r = await window.storage.get("dg-cal-events");
        if (r?.error) {
          setCalLoadError(true);
          setSaveInfo({ state: "error", key: "dg-cal-events", error: "Calendar data could not be loaded safely." });
          setCalEventsLoaded(true);
          return;
        }
        if (r?.value) {
          const parsed = JSON.parse(r.value);
          if (!Array.isArray(parsed)) throw new Error("Invalid calendar data");
          calEventsRef.current = parsed;
          setCalEvents(parsed);
        }
        else {
          // Fallback: read raw localStorage if storage.get returned nothing
          const raw = localStorage.getItem("dg-cal-events");
          if (raw) {
            const parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) throw new Error("Invalid local calendar data");
            calEventsRef.current = parsed;
            setCalEvents(parsed);
          }
        }
        setCalLoadError(false);
      } catch(e) {

  // Calendar helpers
  function saveCalEvents(nextOrUpdater) {
    if (calLoadError) return;
    const current = calEventsRef.current;
    const next = typeof nextOrUpdater === "function" ? nextOrUpdater(current) : nextOrUpdater;
    if (!Array.isArray(next)) return;
    calEventsRef.current = next;
    setCalEvents(next);
    window.storage.set("dg-cal-events", JSON.stringify(next)).catch(console.error);
  }
  function addCalEvent(dateStr, title, start, end, color, repeat, desc, repeatDays) {
    const evt = { id: makeId("ce"), date: dateStr, title, start, end, color: color || "#4fc3f7" };
    if (repeat && repeat !== "none") evt.repeat = repeat;
    if (repeat === "custom" && repeatDays && repeatDays.length) evt.repeatDays = [...repeatDays].sort((a,b) => a-b);
    if (desc) evt.desc = desc;
    saveCalEvents((events) => [...events, evt]);
  }
  function editCalEvent(id, updates) {
    saveCalEvents((events) => events.map(e => e.id === id ? { ...e, ...updates } : e));
  }
  function deleteCalEvent(id, deleteAll, exceptionDate, untilDate) {
    if (untilDate) {
      const evt = calEventsRef.current.find(e => e.id === id);
      if (!evt) return;
      // If truncating from the very first occurrence, that's equivalent to deleting the whole series.
      if (untilDate <= evt.date) { saveCalEvents((events) => events.filter(e => e.id !== id)); return; }
      saveCalEvents((events) => events.map(e => e.id === id ? { ...e, untilDate } : e));
      return;
    }
    if (exceptionDate) {
      // Add exception date to skip this one instance
      saveCalEvents((events) => events.map(e => {
        if (e.id === id) {
          const exceptions = e.exceptions ? [...new Set([...e.exceptions, exceptionDate])] : [exceptionDate];
          return { ...e, exceptions };
        }
        return e;
      }));
    } else if (deleteAll) {
      const evt = calEventsRef.current.find(e => e.id === id);
      if (evt && evt.repeat) {
        saveCalEvents((events) => events.filter(e => !(e.title === evt.title && e.start === evt.start && e.end === evt.end && e.repeat === evt.repeat)));
      } else {
        saveCalEvents((events) => events.filter(e => e.id !== id));
      }
    } else {
      saveCalEvents((events) => events.filter(e => e.id !== id));
    }

  function getEventsForDate(dateStr) {
    const d = new Date(dateStr + "T12:00");
    const dayOfWeek = d.getDay(); // 0=Sun, 1=Mon, etc.
    const directEvents = calEvents.filter(e => e.date === dateStr && !(e.exceptions && e.exceptions.includes(dateStr)));
    const repeatingEvents = calEvents.filter(e => {
      if (!e.repeat) return false;
      if (e.exceptions && e.exceptions.includes(dateStr)) return false;
      if (e.untilDate && dateStr >= e.untilDate) return false; // series truncated at this date
      const eDate = new Date(e.date + "T12:00");
      if (eDate > d) return false; // don't show before the original date
      if (e.date === dateStr) return false; // already in directEvents
      if (e.repeat === "weekly") {
        return eDate.getDay() === dayOfWeek;
      }
      if (e.repeat === "daily") return true;
      if (e.repeat === "weekdays") return dayOfWeek >= 1 && dayOfWeek <= 5;
      if (e.repeat === "custom") return Array.isArray(e.repeatDays) && e.repeatDays.includes(dayOfWeek);
      return false;

    return [...directEvents, ...repeatingEvents];

                  </div>

                      onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}

        {page === "calendar" && (() => {

          );
          const calDates = getCalWeekDates(calWeekOffset);
          const calStartHour = data.calStartHour ?? 6;
          const calEndHour = data.calEndHour ?? 23;
          const totalHours = calEndHour - calStartHour + 1;
          const hours = Array.from({ length: totalHours }, (_, i) => i + calStartHour);
          const startMinBase = calStartHour * 60;
          const HOUR_H = 60; // pixels per hour
          const todayStr = getToday(resetHour);
          const dayNames = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

          function timeToMin(t) { const [h, m] = t.split(":").map(Number); return h * 60 + m; }
          function fmtHour(h) { const hr = ((h % 24) + 24) % 24; if (hr === 0) return "12 AM"; if (hr < 12) return hr + " AM"; if (hr === 12) return "12 PM"; return (hr - 12) + " PM"; }
          function shiftDateStr(ds, deltaDays) { const d = new Date(ds + "T12:00"); d.setDate(d.getDate() + deltaDays); return localDateStr(d); }
          // Returns events that should display in this column. Each item gets _displayMinFromStart (px-y math input).
          function getDisplayedEvents(ds) {
            const normal = getEventsForDate(ds).map(e => {
              const sm = timeToMin(e.start);
              return { ...e, _startOffsetMin: sm - startMinBase };
            });
            if (calEndHour < 24) return normal;
            // Pull next-day's events that fall in the post-midnight portion of this column
            const nextDs = shiftDateStr(ds, 1);
            const spillCutoffHour = calEndHour - 24 + 1; // hours 0..(spillCutoffHour-1) belong to prev column
            const spill = getEventsForDate(nextDs)
              .filter(e => parseInt(e.start.split(":")[0], 10) < spillCutoffHour)
              .map(e => {
                const sm = timeToMin(e.start) + 24 * 60;
                return { ...e, _startOffsetMin: sm - startMinBase, _spilloverFromDate: nextDs };
              });
            return [...normal, ...spill];
          }

          const weekStart = calDates[0];
          const weekEnd = calDates[6];
          const monthLabel = weekStart.getMonth() === weekEnd.getMonth()
            ? weekStart.toLocaleString("default", { month: "long", year: "numeric" })
            : weekStart.toLocaleString("default", { month: "short" }) + " - " + weekEnd.toLocaleString("default", { month: "short", year: "numeric" });

          return (
            <div>
              {/* Header */}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                <button onClick={() => setCalWeekOffset(calWeekOffset - 1)} style={{ background: "none", border: "none", color: "#8b8b9e", fontSize: 20, cursor: "pointer", padding: "4px 12px" }}>{"\u25C0"}</button>
                 <div style={{ textAlign: "center" }}>
                   <div style={{ fontSize: 14, fontWeight: 800, color: "#f0f0f4", letterSpacing: 1 }}>{monthLabel}</div>
                   <button onClick={() => setCalWeekOffset(0)} style={{ background: "none", border: "none", color: "#7c3aed", fontSize: 10, cursor: "pointer", fontWeight: 700, letterSpacing: 2, padding: "4px 8px" }}>TODAY</button>
                   <SaveIndicator info={saveInfo} onRetry={retrySaves} />
                 </div>
                <div style={{ display: "flex", alignItems: "center" }}>
                  <button onClick={() => setCalWeekOffset(calWeekOffset + 1)} style={{ background: "none", border: "none", color: "#8b8b9e", fontSize: 20, cursor: "pointer", padding: "4px 12px" }}>{"\u25B6"}</button>
                  <button onClick={() => setShowCalSettings(true)} title="Calendar settings" style={{ background: "none", border: "none", color: "#8b8b9e", fontSize: 18, cursor: "pointer", padding: "4px 10px" }}>{"\u2699"}</button>
                </div>
              </div>

              {/* Day headers */}
              <div style={{ display: "grid", gridTemplateColumns: "40px repeat(7, 1fr)", gap: 0, marginBottom: 2 }}>
                <div />
                {calDates.map((d, i) => {
                  const ds = localDateStr(d);
                  const isToday = ds === todayStr;
                  return (
                    <div key={i} style={{ textAlign: "center", padding: "4px 0" }}>
                      <div style={{ fontSize: 9, color: isToday ? "#7c3aed" : "#555566", fontWeight: 700, letterSpacing: 1 }}>{dayNames[i]}</div>
                      <div style={{ fontSize: 16, fontWeight: 800, color: isToday ? "#fff" : "#8b8b9e", background: isToday ? "#7c3aed" : "transparent", borderRadius: "50%", width: 28, height: 28, display: "flex", alignItems: "center", justifyContent: "center", margin: "2px auto 0" }}>{d.getDate()}</div>
                    </div>
                  );
                })}
              </div>

              {/* Time grid */}
              <div style={{ overflowX: "auto", overflowY: "auto", height: "calc(100vh - 130px)", background: "#1a1a2e", border: "none", borderRadius: 0 }}>
                <div ref={calGridRef} style={{ display: "grid", gridTemplateColumns: "40px repeat(7, 1fr)", position: "relative", minHeight: hours.length * HOUR_H, userSelect: "none", WebkitUserSelect: "none" }}
                  onMouseMove={(e) => {
                    if (!calGridRef.current) return;
                    const rect = calGridRef.current.getBoundingClientRect();
                    const y = e.clientY - rect.top;
                    const x = e.clientX - rect.left;
                    const totalMin = Math.round((y / HOUR_H) * 60) + startMinBase;
                    const snapped = Math.round(totalMin / 15) * 15;
                    const colW = (rect.width - 40) / 7;
                    const dayIdx = Math.max(0, Math.min(6, Math.floor((x - 40) / colW)));
                    // Drag-to-create on empty space
                    if (calCreating) {
                      setCalCreating({ ...calCreating, endMin: Math.max(calCreating.startMin + 15, snapped) });
                      return;
                    }
                    // Drag existing event
                    if (!calDragging) return;
                    const duration = timeToMin(calDragging.origEnd) - timeToMin(calDragging.origStart);
                    let sm = snapped, em = snapped + duration;
                    let baseDate = calDates[dayIdx];
                    if (sm >= 24 * 60) { sm -= 24 * 60; em -= 24 * 60; const nd = new Date(baseDate); nd.setDate(nd.getDate() + 1); baseDate = nd; }
                    const newStart = `${String(Math.floor(sm/60)).padStart(2,"0")}:${String(sm%60).padStart(2,"0")}`;
                    const newEnd = `${String(Math.floor(em/60)).padStart(2,"0")}:${String(em%60).padStart(2,"0")}`;
                    const newDate = localDateStr(baseDate);
                    setCalDragging({ ...calDragging, newStart, newEnd, newDate, moved: true });
                  }}
                  onMouseUp={() => {
                    // Finish drag-to-create
                    if (calCreating) {
                      const dur = calCreating.endMin - calCreating.startMin;
                      if (dur >= 15) {
                        let sMin = calCreating.startMin, eMin = calCreating.endMin, targetDate = calCreating.date;
                        if (sMin >= 24 * 60) { sMin -= 24 * 60; eMin -= 24 * 60; targetDate = shiftDateStr(targetDate, 1); }
                        const startStr = `${String(Math.floor(sMin/60)).padStart(2,"0")}:${String(sMin%60).padStart(2,"0")}`;
                        const endStr = `${String(Math.floor(eMin/60)).padStart(2,"0")}:${String(eMin%60).padStart(2,"0")}`;
                        setCalAddEvent(targetDate);
                        setCalEventStart(startStr);
                        setCalEventEnd(endStr);
                        setCalEventTitle(""); setCalEventRepeat("none"); setCalEventDesc("");
                      }
                      setCalCreating(null);
                      return;
                    }
                    // Finish drag existing event
                    if (calDragging && calDragging.moved) {
                      const updates = {};
                      if (calDragging.newStart) { updates.start = calDragging.newStart; updates.end = calDragging.newEnd; }
                      if (calDragging.newDate) updates.date = calDragging.newDate;
                      editCalEvent(calDragging.id, updates);
                    }
                    setCalDragging(null);
                  }}
                  onMouseLeave={() => {
                    if (calCreating) {
                      const dur = calCreating.endMin - calCreating.startMin;
                      if (dur >= 15) {
                        let sMin = calCreating.startMin, eMin = calCreating.endMin, targetDate = calCreating.date;
                        if (sMin >= 24 * 60) { sMin -= 24 * 60; eMin -= 24 * 60; targetDate = shiftDateStr(targetDate, 1); }
                        const startStr = `${String(Math.floor(sMin/60)).padStart(2,"0")}:${String(sMin%60).padStart(2,"0")}`;
                        const endStr = `${String(Math.floor(eMin/60)).padStart(2,"0")}:${String(eMin%60).padStart(2,"0")}`;
                        setCalAddEvent(targetDate);
                        setCalEventStart(startStr);
                        setCalEventEnd(endStr);
                        setCalEventTitle(""); setCalEventRepeat("none"); setCalEventDesc("");
                      }
                      setCalCreating(null);
                      return;
                    }
                    if (calDragging && calDragging.moved) {
                      const updates = {};
                      if (calDragging.newStart) { updates.start = calDragging.newStart; updates.end = calDragging.newEnd; }
                      if (calDragging.newDate) updates.date = calDragging.newDate;
                      editCalEvent(calDragging.id, updates);
                    }
                    setCalDragging(null);
                  }}
                  onTouchMove={(e) => {
                    if (!calGridRef.current) return;
                    if (!calCreating && !calDragging) return; // allow normal scroll when not dragging
                    e.preventDefault();
                    const touch = e.touches[0];
                    const rect = calGridRef.current.getBoundingClientRect();
                    const y = touch.clientY - rect.top;
                    const x = touch.clientX - rect.left;
                    const totalMin = Math.round((y / HOUR_H) * 60) + startMinBase;
                    const snapped = Math.round(totalMin / 15) * 15;
                    const colW = (rect.width - 40) / 7;
                    const dayIdx = Math.max(0, Math.min(6, Math.floor((x - 40) / colW)));
                    if (calCreating) {
                      setCalCreating({ ...calCreating, endMin: Math.max(calCreating.startMin + 15, snapped) });
                      return;
                    }
                    if (!calDragging) return;
                    const duration = timeToMin(calDragging.origEnd) - timeToMin(calDragging.origStart);
                    let sm = snapped, em = snapped + duration;
                    let baseDate = calDates[dayIdx];
                    if (sm >= 24 * 60) { sm -= 24 * 60; em -= 24 * 60; const nd = new Date(baseDate); nd.setDate(nd.getDate() + 1); baseDate = nd; }
                    const newStart = `${String(Math.floor(sm/60)).padStart(2,"0")}:${String(sm%60).padStart(2,"0")}`;
                    const newEnd = `${String(Math.floor(em/60)).padStart(2,"0")}:${String(em%60).padStart(2,"0")}`;
                    const newDate = localDateStr(baseDate);
                    setCalDragging({ ...calDragging, newStart, newEnd, newDate, moved: true });
                  }}
                  onTouchEnd={() => {
                    if (calCreating) {
                      const dur = calCreating.endMin - calCreating.startMin;
                      if (dur >= 15) {
                        let sMin = calCreating.startMin, eMin = calCreating.endMin, targetDate = calCreating.date;
                        if (sMin >= 24 * 60) { sMin -= 24 * 60; eMin -= 24 * 60; targetDate = shiftDateStr(targetDate, 1); }
                        const startStr = `${String(Math.floor(sMin/60)).padStart(2,"0")}:${String(sMin%60).padStart(2,"0")}`;
                        const endStr = `${String(Math.floor(eMin/60)).padStart(2,"0")}:${String(eMin%60).padStart(2,"0")}`;
                        setCalAddEvent(targetDate);
                        setCalEventStart(startStr);
                        setCalEventEnd(endStr);
                        setCalEventTitle(""); setCalEventRepeat("none"); setCalEventDesc("");
                      }
                      setCalCreating(null);
                      return;
                    }
                    if (calDragging && calDragging.moved) {
                      const updates = {};
                      if (calDragging.newStart) { updates.start = calDragging.newStart; updates.end = calDragging.newEnd; }
                      if (calDragging.newDate) updates.date = calDragging.newDate;
                      editCalEvent(calDragging.id, updates);
                    }
                    setCalDragging(null);
                  }}
                >
                  {/* Hour labels + grid lines */}
                  {hours.map((h, hi) => (
                    <React.Fragment key={h}>
                      <div style={{ gridColumn: "1", gridRow: hi + 1, fontSize: 9, color: "#555566", textAlign: "right", paddingRight: 6, paddingTop: 2, height: HOUR_H, borderTop: "1px solid #2d2d3a22" }}>{fmtHour(h)}</div>
                      {calDates.map((d, di) => (
                        <div key={di} style={{ gridColumn: di + 2, gridRow: hi + 1, borderTop: "1px solid #2d2d3a44", borderLeft: "1px solid #2d2d3a22", height: HOUR_H, cursor: "crosshair", position: "relative" }}
                          onMouseDown={(e) => {
                            if (calDragging) return;
                            e.preventDefault();
                            const rect = calGridRef.current.getBoundingClientRect();
                            const y = e.clientY - rect.top;
                            const totalMin = Math.round((y / HOUR_H) * 60) + startMinBase;
                            const snapped = Math.round(totalMin / 15) * 15;
                            setCalCreating({ date: localDateStr(d), startMin: snapped, endMin: snapped + 15, di });
                          }} />
                      ))}
                    </React.Fragment>
                  ))}

                  {/* Drag-to-create preview */}
                  {calCreating && (() => {
                    const topPx = ((calCreating.startMin - startMinBase) / 60) * HOUR_H;
                    const heightPx = Math.max(((calCreating.endMin - calCreating.startMin) / 60) * HOUR_H, 15);
                    const fmtT = (m) => { const hr = Math.floor(m/60); const mn = m%60; const ampm = hr >= 12 ? "pm" : "am"; return `${hr > 12 ? hr-12 : hr || 12}:${String(mn).padStart(2,"0")}${ampm}`; };
                    return (
                      <div style={{
                        position: "absolute", left: `calc(40px + ${calCreating.di} * ((100% - 40px) / 7) + 1px)`, width: `calc((100% - 40px) / 7 - 3px)`,
                        top: topPx, height: heightPx, background: "#7c3aed88", border: "2px solid #7c3aed", borderRadius: 4, padding: "2px 6px",
                        fontSize: 10, color: "#fff", fontWeight: 700, zIndex: 25, pointerEvents: "none",
                      }}>
                        <div>(New event)</div>
                        <div style={{ fontSize: 9, opacity: 0.8 }}>{fmtT(calCreating.startMin)} - {fmtT(calCreating.endMin)}</div>
                      </div>
                    );
                  })()}

                  {/* Events overlay */}
                  {calDates.map((d, di) => {
                    const ds = localDateStr(d);
                    const dayEvents = getDisplayedEvents(ds);
                    return dayEvents.map(evt => {
                      const isDraggingThis = calDragging && calDragging.id === (evt._origId || evt.id);
                      if (isDraggingThis && calDragging.newDate && calDragging.newDate !== ds) return null; // hide from original column
                      const displayStart = isDraggingThis && calDragging.newStart ? calDragging.newStart : evt.start;
                      const displayEnd = isDraggingThis && calDragging.newEnd ? calDragging.newEnd : evt.end;
                      const startMin = timeToMin(displayStart);
                      const endMin = timeToMin(displayEnd);
                      const spillShift = evt._spilloverFromDate ? 24 * 60 : 0;
                      const topPx = ((startMin + spillShift - startMinBase) / 60) * HOUR_H;
                      const heightPx = Math.max(((endMin - startMin) / 60) * HOUR_H, 20);
                      const fmtTime = (t) => { const [h,m] = t.split(":"); const hr = parseInt(h); const ampm = hr >= 12 ? "pm" : "am"; return `${hr > 12 ? hr-12 : hr || 12}:${m}${ampm}`; };
                      const isRepeating = evt._repeating || evt.repeat;
                      // If dragging to a different day, render at that column
                      let displayDi = di;
                      if (isDraggingThis && calDragging.newDate) {
                        const idx = calDates.findIndex(cd => localDateStr(cd) === calDragging.newDate);
                        if (idx >= 0) displayDi = idx;
                      }
                      return (
                        <div key={evt.id} style={{
                          position: "absolute", left: `calc(40px + ${displayDi} * ((100% - 40px) / 7) + 1px)`, width: `calc((100% - 40px) / 7 - 3px)`,
                          top: topPx, height: heightPx, background: evt.color || "#4fc3f7", borderRadius: 4, padding: "2px 4px", overflow: "hidden",
                          fontSize: 9, color: "#fff", fontWeight: 700, cursor: isDraggingThis ? "grabbing" : "grab", zIndex: isDraggingThis ? 30 : 10,
                          boxShadow: isDraggingThis ? "0 4px 12px #00000088" : "0 1px 3px #00000044", lineHeight: 1.2,
                          borderLeft: isRepeating ? "3px solid #ffffff88" : "none", opacity: isDraggingThis ? 0.85 : 1,
                          transition: isDraggingThis ? "none" : "top 0.15s, height 0.15s", userSelect: "none",
                        }}
                          onClick={(e) => { e.stopPropagation();
                            if (calDragging && calDragging.moved) return; // don't open popup after drag
                            const origId = evt._origId || evt.id;
                            const origEvt = calEvents.find(ev => ev.id === origId) || evt;
                            setCalSelectedEvent({ ...origEvt, _displayDate: evt._spilloverFromDate || ds });
                            setCalEditMode(false);
                          }}
                          onMouseDown={(e) => { e.stopPropagation(); e.preventDefault();
                            const origId = evt._origId || evt.id;
                            if (evt._repeating) return;
                            setCalDragging({ id: origId, origStart: evt.start, origEnd: evt.end, moved: false });
                          }}
                          onTouchStart={(e) => {
                            const origId = evt._origId || evt.id;
                            if (evt._repeating) return;
                            const sx = e.touches[0].clientX;
                            const sy = e.touches[0].clientY;
                            const target = e.currentTarget;
                            target._dragStartX = sx;
                            target._dragStartY = sy;
                            const timer = setTimeout(() => {
                              setCalDragging({ id: origId, origStart: evt.start, origEnd: evt.end, moved: false });
                              try { navigator.vibrate && navigator.vibrate(35); } catch (er) {}
                            }, 550);
                            target._dragTimer = timer;
                          }}
                          onTouchMove={(e) => {
                            const t = e.currentTarget;
                            if (!t._dragTimer) return;
                            const dx = Math.abs(e.touches[0].clientX - t._dragStartX);
                            const dy = Math.abs(e.touches[0].clientY - t._dragStartY);
                            if (dx > 8 || dy > 8) {
                              clearTimeout(t._dragTimer);
                              t._dragTimer = null;
                            }
                          }}
                          onTouchEnd={(e) => { if (e.currentTarget._dragTimer) { clearTimeout(e.currentTarget._dragTimer); e.currentTarget._dragTimer = null; } }}
                          onTouchCancel={(e) => { if (e.currentTarget._dragTimer) { clearTimeout(e.currentTarget._dragTimer); e.currentTarget._dragTimer = null; } }}

                        </div>
                      );

                      nowDay = (nowDay + 6) % 7;

              {/* Calendar settings modal */}

      <label style={S.lbl}>Name</label><input style={S.inp} value={formName} onChange={(e) => setFormName(e.target.value)} autoFocus />
      <label style={S.lbl}>Points</label><input style={S.inp} type="number" value={formPoints} onChange={(e) => setFormPoints(e.target.value)} min="1" />
      <label style={S.lbl}>Description (optional)</label><textarea style={S.textarea} value={formDesc} onChange={(e) => setFormDesc(e.target.value)} placeholder="e.g., Mon-Push, Tue-Rest, Wed-Pull..." rows={3} />
      <div style={S.fAct}><button onClick={() => { setView("main"); setFormDesc(""); }} style={S.cBtn}>Cancel</button><button onClick={() => addHabit(editSection)} style={S.okBtn}>Add</button></div>
    </div>);
  }

  if (view === "editHabit" && editItem) {
    return FW(<div style={S.fCard}><h2 style={S.fTitle}>EDIT HABIT</h2>
      <label style={S.lbl}>Name</label><input style={S.inp} value={formName} onChange={(e) => setFormName(e.target.value)} autoFocus />
      <label style={S.lbl}>Points</label><input style={S.inp} type="number" value={formPoints} onChange={(e) => setFormPoints(e.target.value)} min="1" />
      <label style={S.lbl}>Description</label><textarea style={S.textarea} value={formDesc} onChange={(e) => setFormDesc(e.target.value)} placeholder="Add details, schedule, notes..." rows={4} />
      <label style={S.lbl}>{"\uD83D\uDCDD"} Today's Comment</label><textarea style={{ ...S.textarea, borderColor: "#7c3aed44" }} value={formComment} onChange={(e) => setFormComment(e.target.value)} placeholder="e.g., 82.5kg, skipped because sick, did 30 min instead..." rows={2} />
      <label style={S.lbl}>Move to section</label>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 4 }}>
        {data.habitSections.map((sec) => <button key={sec.id} onClick={() => moveHabitTo(sec.id)} style={{ padding: "7px 12px", background: editSection === sec.id ? "#7c3aed33" : "#12122a", border: `1px solid ${editSection === sec.id ? "#7c3aed" : "#2d2d3a"}`, borderRadius: 8, color: editSection === sec.id ? "#7c3aed" : "#8b8b9e", fontSize: 10, cursor: "pointer", fontFamily: "inherit" }}>{sec.icon} {sec.title}</button>)}
      </div>
      <div style={S.fAct}>
        <button onClick={() => deleteHabit(editItem.id)} style={S.dBtn}>Delete</button>
        <button onClick={() => { setView("main"); setEditItem(null); }} style={S.cBtn}>Cancel</button>
        <button onClick={saveHabitEdit} style={S.okBtn}>Save</button>
      </div>
    </div>);
  }

  if (view === "editTask" && editTaskCtx) {
    const setQuick = (days) => {
      const d = new Date(); d.setDate(d.getDate() + days);
      const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      setFormTaskDeadline(iso);
    };
    return FW(<div style={S.fCard}><h2 style={S.fTitle}>EDIT TASK</h2>
      <label style={S.lbl}>Name</label><input style={S.inp} value={formTaskName} onChange={(e) => setFormTaskName(e.target.value)} autoFocus />
      <label style={S.lbl}>Points</label><input style={S.inp} type="number" value={formTaskPoints} onChange={(e) => setFormTaskPoints(e.target.value)} min="0" />
      <label style={S.lbl}>Deadline</label>
      <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
        <button onClick={() => setQuick(0)} style={{ flex: 1, padding: "8px 4px", borderRadius: 8, fontSize: 10, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1, border: "1px solid #2d2d3a", background: "#12122a", color: "#8b8b9e" }}>Today</button>
        <button onClick={() => setQuick(1)} style={{ flex: 1, padding: "8px 4px", borderRadius: 8, fontSize: 10, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1, border: "1px solid #2d2d3a", background: "#12122a", color: "#8b8b9e" }}>Tmrw</button>
        <button onClick={() => setQuick(3)} style={{ flex: 1, padding: "8px 4px", borderRadius: 8, fontSize: 10, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1, border: "1px solid #2d2d3a", background: "#12122a", color: "#8b8b9e" }}>3d</button>
        <button onClick={() => setQuick(7)} style={{ flex: 1, padding: "8px 4px", borderRadius: 8, fontSize: 10, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1, border: "1px solid #2d2d3a", background: "#12122a", color: "#8b8b9e" }}>1wk</button>
        <button onClick={() => { setFormTaskDeadline(""); setFormTaskTime(""); }} style={{ flex: 1, padding: "8px 4px", borderRadius: 8, fontSize: 10, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1, border: "1px solid #2d2d3a", background: "#12122a", color: "#ff4757" }}>Clear</button>
      </div>
      <div style={{ display: "flex", gap: 10 }}>
        <div style={{ flex: 1 }}><label style={{ ...S.lbl, marginTop: 0 }}>Date</label>
          <input type="date" style={S.inp} value={formTaskDeadline} onChange={(e) => setFormTaskDeadline(e.target.value)} /></div>
        <div style={{ flex: 1 }}><label style={{ ...S.lbl, marginTop: 0 }}>Time (optional)</label>
          <input type="time" style={S.inp} value={formTaskTime} onChange={(e) => setFormTaskTime(e.target.value)} disabled={!formTaskDeadline} /></div>
      </div>
      <label style={S.lbl}>Move to list</label>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 4 }}>
        {data.taskLists.map((l) => {
          const isCurrent = editTaskCtx.listId === l.id;
          return (
            <button key={l.id} onClick={() => moveTaskTo(l.id)}
              style={{ padding: "7px 12px", background: isCurrent ? "#7c3aed33" : "#12122a", border: `1px solid ${isCurrent ? "#7c3aed" : "#2d2d3a"}`, borderRadius: 8, color: isCurrent ? "#7c3aed" : "#8b8b9e", fontSize: 10, cursor: "pointer", fontFamily: "inherit", fontWeight: 700, letterSpacing: 1 }}>
              {l.title}{l.resetsDaily && <span style={{ marginLeft: 4, fontSize: 8 }}>{"↻"}</span>}
            </button>
          );
        })}
      </div>
      <button onClick={() => { setPomoTask(formTaskName.trim() || "Task"); setEditTaskCtx(null); setView("main"); setPage("timer"); }}
        style={{ width: "100%", marginTop: 18, padding: "12px", background: "#7c3aed22", border: "1px solid #7c3aed", borderRadius: 10, color: "#c4b5fd", fontSize: 11, fontWeight: 800, letterSpacing: 2, cursor: "pointer", fontFamily: "inherit" }}>
        {"↑ SEND TO POMODORO"}
      </button>
      <div style={S.fAct}>
        <button onClick={() => { deleteTaskItem(editTaskCtx.listId, editTaskCtx.itemId); setEditTaskCtx(null); setView("main"); }} style={S.dBtn}>Delete</button>
        <button onClick={() => { setEditTaskCtx(null); setView("main"); }} style={S.cBtn}>Cancel</button>
        <button onClick={saveTaskEdit} style={S.okBtn}>Save</button>
      </div>
    </div>);
  }

  if (view === "store") {
    const items = data.storeItems || mkStoreDefaults(data.dailyGoal);
    const purchases = (data.storePurchases || []).slice(0, 5);
    return FW(<div style={S.fCard}>
      {storeBuyAnim && (
        <div className="overlay-pop" style={{ ...S.win, background: "radial-gradient(circle at center,#00d9ff26 0%,#0b0b14f2 62%)", pointerEvents: "none" }}>
          <div style={{ fontSize: 48, marginBottom: 12 }}>{"🛒"}</div>
          <div style={{ ...S.winTxt, color: "#00d9ff", textShadow: "0 0 40px #00d9ff66" }}>{storeBuyAnim.toUpperCase()}</div>
          <div style={S.winSub}>You earned it. Enjoy it guilt-free.</div>
        </div>
      )}
      <h2 style={S.fTitle}>{"🛒"} STORE</h2>
      <div style={{ fontSize: 10, color: "#8b8b9e", letterSpacing: 1, marginBottom: 18, lineHeight: 1.6 }}>You don't take cheat days. You earn them. Spending never touches your XP or level.</div>
      <div style={{ background: "#12122a", border: "1px solid #2d2d3a", borderRadius: 12, padding: "16px", marginBottom: 20, textAlign: "center" }}>
        <div style={{ fontSize: 34, fontWeight: 900, color: "#00d9ff", lineHeight: 1 }}>{walletBalance.toLocaleString()}</div>
        <div style={{ fontSize: 9, color: "#8b8b9e", letterSpacing: 3, fontWeight: 700, marginTop: 6 }}>SPENDABLE POINTS</div>
        <div style={{ fontSize: 9, color: "#555566", marginTop: 4 }}>{walletEarned.toLocaleString()} earned lifetime {"·"} {(data.walletSpent || 0).toLocaleString()} spent</div>
      </div>
      {items.map((item) => {
        const affordable = walletBalance >= item.price;
        if (editStoreId === item.id) {
          return (
            <div key={item.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "12px 0", borderBottom: "1px solid #2d2d3a" }}>
              <input style={{ ...S.inp, flex: 2, padding: "9px 11px" }} value={editStoreName} onChange={(e) => setEditStoreName(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") saveStoreEdit(); }} autoFocus />
              <input style={{ ...S.inp, flex: 1, padding: "9px 11px" }} type="number" value={editStorePrice} onChange={(e) => setEditStorePrice(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") saveStoreEdit(); }} />
              <button onClick={saveStoreEdit} style={{ padding: "9px 14px", borderRadius: 9, border: "none", background: "#4cd137", color: "#fff", fontSize: 13, fontWeight: 900, cursor: "pointer", fontFamily: "inherit" }}>{"✓"}</button>
              <button onClick={() => setEditStoreId(null)} style={{ padding: "9px 12px", borderRadius: 9, border: "1px solid #2d2d3a", background: "none", color: "#8b8b9e", fontSize: 13, fontWeight: 900, cursor: "pointer", fontFamily: "inherit" }}>{"✕"}</button>
            </div>
          );
        }
        return (
          <div key={item.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 0", borderBottom: "1px solid #2d2d3a" }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#f0f0f4" }}>{item.name}</div>
              <div style={{ fontSize: 10, color: affordable ? "#00d9ff" : "#555566", fontWeight: 700, marginTop: 2 }}>{item.price.toLocaleString()} pts</div>
            </div>
            <button onClick={() => startStoreEdit(item)} title="Edit reward" style={{ background: "none", border: "none", cursor: "pointer", fontSize: 13, color: "#8b8b9e", padding: "2px 6px", fontFamily: "inherit" }}>{"✎"}</button>
            <button onClick={() => buyStoreItem(item, walletBalance)} disabled={!affordable}
              style={{ padding: "9px 18px", borderRadius: 9, border: "none", background: affordable ? "linear-gradient(135deg,#00d9ff,#0abde3)" : "#2d2d3a", color: affordable ? "#0b0b14" : "#555566", fontSize: 11, fontWeight: 900, letterSpacing: 1, cursor: affordable ? "pointer" : "default", fontFamily: "inherit" }}>
              {affordable ? "BUY" : "LOCKED"}
            </button>
            <button onClick={() => { if (confirm(`Remove "${item.name}" from the store?`)) deleteStoreItem(item.id); }} style={S.tX}>&times;</button>
          </div>
        );
      })}
      <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
        <input style={{ ...S.inp, flex: 2 }} placeholder="Add your own reward..." value={storeName} onChange={(e) => setStoreName(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") addStoreItem(); }} />
        <input style={{ ...S.inp, flex: 1 }} type="number" placeholder="pts" value={storePrice} onChange={(e) => setStorePrice(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") addStoreItem(); }} />
        <button onClick={addStoreItem} style={{ ...S.okBtn, flex: "none", padding: "11px 16px" }}>Add</button>
      </div>
      {purchases.length > 0 && (
        <div style={{ marginTop: 22, borderTop: "1px solid #2d2d3a", paddingTop: 14 }}>
          <div style={{ fontSize: 9, color: "#8b8b9e", letterSpacing: 3, fontWeight: 800, marginBottom: 8 }}>RECENT PURCHASES</div>
          {purchases.map((p) => (
            <div key={p.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", fontSize: 11, color: "#8b8b9e" }}>
              <span>{p.name}</span>
              <span style={{ color: "#555566" }}>-{p.price.toLocaleString()} {"·"} {fmtDoneDate(p.date)}</span>
            </div>
          ))}
        </div>
      )}
      <div style={S.fAct}>
        <button onClick={() => setView("main")} style={S.cBtn}>Back</button>
      </div>
    </div>);
  }

  if (view === "settings") {
    return FW(<div style={S.fCard}><h2 style={S.fTitle}>SETTINGS</h2>
      <label style={S.lbl}>Daily Point Goal</label><input style={S.inp} type="number" value={goalInput} onChange={(e) => setGoalInput(e.target.value)} min="1" />
      <div style={S.fAct}><button onClick={() => setView("main")} style={S.cBtn}>Cancel</button><button onClick={saveGoal} style={S.okBtn}>Save</button></div>
      <div style={{ marginTop: 28, borderTop: "1px solid #2d2d3a", paddingTop: 20 }}>
        <label style={S.lbl}>Day Resets At</label>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {[0,1,2,3,4,5,6].map(h => (
            <button key={h} onClick={() => save((current) => ({ ...current, dayResetHour: h }))}
              style={{ padding: "8px 14px", borderRadius: 8, border: (data.dayResetHour || 0) === h ? "2px solid #7c3aed" : "1px solid #2d2d3a",
                background: (data.dayResetHour || 0) === h ? "#7c3aed22" : "#12122a", color: (data.dayResetHour || 0) === h ? "#7c3aed" : "#8b8b9e",
                fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
              {h === 0 ? "Midnight" : `${h} AM`}
            </button>
          ))}
        </div>
        <div style={{ fontSize: 10, color: "#8b8b9e", marginTop: 6 }}>When the day flips over. Habits & daily tasks reset at this time.</div>
      </div>
      <div style={{ marginTop: 28, borderTop: "1px solid #2d2d3a", paddingTop: 20 }}>
        <label style={S.lbl}>Account</label>
        {window._user ? (
          <div>
            <div style={{ fontSize: 12, color: "#4cd137", marginBottom: 8 }}>Signed in as {window._user.email || window._user.displayName || "your account"}</div>
            <div style={{ fontSize: 10, color: "#8b8b9e", marginBottom: 12, lineHeight: 1.5 }}>Your data is saved to your account and syncs on every device you sign in on.</div>
            <div style={S.fAct}>
              <button onClick={() => { alert("Pulling latest from cloud..."); location.reload(); }} style={S.cBtn}>Pull from Cloud</button>
              <button onClick={async () => { await window._signOut(); location.reload(); }} style={S.dBtn}>Sign out</button>
            </div>
          </div>
        ) : (
          <div>
            <div style={{ fontSize: 10, color: "#8b8b9e", marginBottom: 12, lineHeight: 1.5 }}>Sign in to save your data to a personal account that syncs on all your devices. (Replaces sync codes.)</div>
            <button onClick={async () => {
              try {
                await window._signInWithGoogle();
                location.reload();
              } catch (e) {
                const code = e && e.code;
                if (code === "auth/operation-not-allowed") alert("Google sign-in isn't switched on yet.\n\nFirebase console: Authentication, Sign-in method, enable Google.");
                else if (code === "auth/unauthorized-domain") alert("This domain isn't authorized yet.\n\nFirebase console: Authentication, Settings, Authorized domains, add feroakdemir-arch.github.io");
                else if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") { /* user changed their mind */ }
                else alert("Sign-in failed: " + ((e && e.message) || e));
              }
            }} style={{ ...S.okBtn, background: "#fff", color: "#1a1a2e", display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>
              <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.3l-6.3-5.4C29.3 34.9 26.8 36 24 36c-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4 5.6l6.3 5.4C41.4 35.4 44 30.1 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
              Continue with Google
            </button>
          </div>
        )}
      </div>
      {!window._user && <div style={{ marginTop: 28, borderTop: "1px solid #2d2d3a", paddingTop: 20 }}>
        <label style={S.lbl}>Sync Code (legacy: same code on all devices to sync)</label>
        <input style={S.inp} type="text" value={syncCode} onChange={(e) => setSyncCode(e.target.value.trim())} placeholder="e.g. mycode123" />
        <div style={S.fAct}>
          <button onClick={() => { window._setSyncCode(syncCode || null); alert(syncCode ? "Sync code set! Use the same code on your other devices." : "Sync disabled."); location.reload(); }} style={S.okBtn}>{syncCode ? "Enable Sync" : "Disable Sync"}</button>
          {window._getSyncCode() && <button onClick={() => { alert("Pulling latest from cloud..."); location.reload(); }} style={{ ...S.cBtn, marginLeft: 8 }}>Pull from Cloud</button>}
        </div>
        {window._getSyncCode() && (
          <div style={{ marginTop: 12, fontSize: 10, color: "#4cd137", letterSpacing: 1.5 }}>
            {"\u25CF"} LIVE SYNC ACTIVE — cloud is source of truth
          </div>
        )}
      </div>}
      <div style={{ marginTop: 28, borderTop: "1px solid #2d2d3a", paddingTop: 20 }}>
        <label style={S.lbl}>Recover lost data</label>
        <div style={{ fontSize: 10, color: "#8b8b9e", marginBottom: 8, lineHeight: 1.5 }}>If you used a sync code before creating your account, enter it here to pull that data into your account.</div>
        <div style={{ display: "flex", gap: 8 }}>
          <input style={{ ...S.inp, flex: 1 }} value={recoverCode} onChange={(e) => setRecoverCode(e.target.value.trim())} placeholder="backup code" />
          <button onClick={() => recoverFromSyncCode(recoverCode)} style={{ ...S.okBtn, flex: "none", padding: "11px 20px" }}>Recover</button>
        </div>
      </div>
      <div style={{ marginTop: 28, borderTop: "1px solid #2d2d3a", paddingTop: 20 }}>
        <button onClick={resetAll} style={{ width: "100%", padding: 11, background: "none", border: "1px solid #ff475733", borderRadius: 8, color: "#ff4757", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", letterSpacing: 2, textTransform: "uppercase" }}>Reset Everything</button>
      </div>
    </div>);
  }
  return null;
}

  week: { display: "flex", justifyContent: "space-between", gap: 2 },

  pickerWrap: { marginTop: 10, padding: "12px 0 4px", borderTop: "1px solid #2d2d3a" },
  pickBtn: { width: 44, height: 44, borderRadius: 22, border: "none", fontSize: 20, fontWeight: 900, color: "#fff", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "inherit", boxShadow: "0 2px 8px #00000022", boxSizing: "border-box" },
